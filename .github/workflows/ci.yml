name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a run is right on a branch and wrong on the default one.
  #
  # `main` here takes direct pushes, and required status checks gate pull
  # request merges only - so for a direct push the push-triggered run IS the
  # gate. Cancelling it on the next push destroys that gate, and a cancelled
  # run reports as `cancelled`, not `failed`: it is not red in the Actions
  # list and nothing downstream reacts to it. Twenty-five of the last hundred
  # `main` runs ended that way, so a quarter of the default branch's history
  # carries no verdict at all.
  #
  # On any other ref an in-flight run is genuinely obsolete once a newer commit
  # arrives, so keep cancelling there.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"

jobs:
  # Every other job installs with --locked, so a lockfile that has drifted from
  # pyproject.toml fails all of them at once, inside "Install dependencies",
  # where the cause is easy to miss. This job isolates that one question and
  # answers it in seconds, so the drift reads as itself rather than as a
  # repository-wide outage.
  lockfile:
    name: Lockfile In Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify uv.lock matches pyproject.toml
        run: |
          if ! uv lock --locked; then
            echo "::error::uv.lock has drifted from pyproject.toml. Every job that installs with --locked will fail until this is fixed. Run 'uv lock' and commit the result."
            exit 1
          fi

  # `.python-version` is the single interpreter pin: every job resolves its
  # Python from that file, and `requires-python` bounds the same range. Nothing
  # enforces that the interpreter actually installed matches it, though - a
  # setup action that silently falls back to a different minor would leave the
  # declared pin and the tested interpreter disagreeing, which is exactly the
  # drift that invalidated venvs across this estate when a host OS upgrade
  # moved the system interpreter. This job compares the two directly.
  interpreter-pin:
    name: Interpreter Matches Pin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Verify the interpreter matches .python-version
        run: |
          pinned="$(tr -d '[:space:]' < .python-version)"
          actual="$(python -c 'import sys; print("{}.{}".format(*sys.version_info[:2]))')"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::Interpreter mismatch: .python-version pins ${pinned} but the resolved interpreter is ${actual}. Every job in this workflow runs on ${actual}, so the declared pin is not what is being tested."
            exit 1
          fi
          echo "Interpreter matches the pin: ${actual}"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11

      # A published binary nobody executes is an untested binary. The
      # acquisition check is the only thing that starts a release asset on a
      # machine with no checkout and no toolchain, so a target it does not
      # cover ships unexercised.
      #
      # That is not hypothetical: v0.1.71 attached
      # vaultspec-core-aarch64-unknown-linux-gnu and the acquisition matrix
      # still fetched only the x86_64 file. The release guards were already
      # derived from the build matrix and stayed green, because they assert the
      # asset EXISTS, not that anything ran it. This seam had no derivation at
      # all, which is why adding a target quietly left a hole.
      #
      # Runs on every pull request rather than at release time, so the branch
      # that adds a target is the one that goes red.
      - name: Every built Linux target is acquired
        shell: bash
        run: |
          set -euo pipefail
          binaries=.github/workflows/binaries.yml
          acquisition=.github/workflows/acquisition.yml
          mapfile -t targets < <(
            awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${binaries}" |
              grep -- '-linux-gnu$' | sort -u
          )
          # A derivation that yields nothing would pass every run without
          # asserting anything. Refuse to run rather than pass vacuously.
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::No Linux targets found in ${binaries}; the acquisition-coverage assertion cannot run"
            exit 1
          fi
          echo "Derived ${#targets[@]} Linux target(s) from ${binaries}: ${targets[*]}"
          missing=()
          for triple in "${targets[@]}"; do
            grep -qF -- "vaultspec-core-${triple}" "${acquisition}" || missing+=("${triple}")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::${acquisition} acquires no asset for: ${missing[*]}. A target that is built and published must also be executed from the published release."
            exit 1
          fi
          echo "all ${#targets[@]} Linux target(s) are acquired"

      # The offline gate is a SECOND matrix over the same targets, and this
      # repository has now twice shipped a defect whose whole cause was a list
      # that had to be edited in lockstep with the build matrix and was not:
      # the preflight's hand-kept runner selectors, and the release's hand-kept
      # target expectations (#361/#364). Both were fixed by deriving. The
      # offline gate cannot be derived - GitHub has no way to share one matrix
      # between two jobs - so it is asserted instead, here, on every pull
      # request.
      #
      # A target present in `build` and absent from `offline` is the failure
      # this stops: its artifact would be uploaded as `unverified-*` and never
      # renamed, so the release would silently lose that platform. A target
      # present in `offline` and absent from `build` fails its download and
      # reds the release for no reason.
      - name: Every built target is gated offline
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/binaries.yml
          # One job block at a time: `target:` appears in both matrices and a
          # file-wide grep cannot tell them apart. A job header is a key at two
          # spaces of indentation, which is the boundary this walks.
          targets_of() {
            awk -v want="  $1:" '
              $0 == want { inside = 1; next }
              /^  [a-z][a-zA-Z0-9_-]*:[[:space:]]*$/ { inside = 0 }
              inside && $1 == "target:" { print $2 }
            ' "${workflow}" | sort -u
          }
          mapfile -t built < <(targets_of build)
          mapfile -t gated < <(targets_of offline)
          # Neither list may be empty, or this comparison passes vacuously -
          # including the case where a job was renamed and the awk matches
          # nothing at all.
          if [ ${#built[@]} -eq 0 ] || [ ${#gated[@]} -eq 0 ]; then
            echo "::error::derived ${#built[@]} built and ${#gated[@]} gated target(s) from ${workflow}; a job was renamed or the matrix shape moved, and this assertion cannot run"
            exit 1
          fi
          echo "built:  ${built[*]}"
          echo "gated:  ${gated[*]}"
          if [ "${built[*]}" != "${gated[*]}" ]; then
            echo "::error::the build matrix and the offline gate cover different targets. Every target that is built must be run with the network taken away before it can become a release asset."
            exit 1
          fi
          echo "all ${#built[@]} built target(s) are gated offline"

  lint-and-type:
    name: Lint, Type, Config, Link, and Markdown Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Ruff
        run: just lint python

      - name: Ty
        run: just lint type

      # This job runs Linux, so `just lint type` above only ever proves the
      # Linux view. The tree carries both Windows (`msvcrt`, `ctypes.WinDLL`)
      # and POSIX (`fcntl`) branches, so a contributor on either OS can be
      # green locally while the other platform is broken. Checking all three
      # targets here means CI and a local run agree regardless of host.
      - name: Ty (all target platforms)
        if: always()
        run: just lint type-platforms

      - name: Taplo
        run: just lint toml

      - name: Lychee
        run: just lint links

      - name: pymarkdown
        run: just lint markdown

      # Baseline-ratcheted gates. Each threshold sits at this tree's worst
      # current offender (see the census comments in pyproject.toml), so these
      # are green today and fail only on a NEW record-breaking offender. They
      # run after the cheap checks because they are the slow ones.
      #
      # `if: always()` on every gate below is deliberate. These steps
      # previously did not exist, and the failure mode they guard against is
      # real: a gate placed behind a red step never runs at all, so a
      # regression it would have caught reaches the default branch unseen. Each
      # gate must report its own verdict independently of its neighbours.
      - name: Cognitive complexity
        if: always()
        run: just lint complexity

      - name: Nesting depth
        if: always()
        run: just lint nesting

      - name: Module and class size
        if: always()
        run: just lint size

      # Strict typing's burndown reached zero, so this step is a real gate:
      # a regression fails the job like every other lint dimension here.
      - name: Strict types
        if: always()
        run: just lint type-strict

  code-health:
    name: Code Health (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      # Measurement only - every target exits 0. This is the instrument the
      # earlier health audits lacked: it ranks the worst offenders per
      # dimension so the ratchet has a target list rather than an intention.
      - name: Advisory audit dimensions
        run: just audit all

      - name: Code-health report
        run: just health fast

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Run tests
        run: just test unit

      - name: Run development harness guards
        run: just test harness

      # The repository-health guards - the automation contracts, the packaging
      # metadata, the shipped templates, the typings/ stubs, the suite-quality
      # checks. They are selected by the `repo` MARKER rather than by path, so
      # this step gates them wherever they are filed, including the ones the
      # package-boundary audit is still finding inside src/. It exists because
      # the equivalent lane once had no CI step at all and the doubles guard
      # inside it failed unobserved: a guard nothing runs is not a guard.
      - name: Run repository-health guards
        run: just test repo

  broad-tests:
    name: broad (${{ matrix.os }})
    # The required "Tests" gate above is marker-scoped to `unit`, which hides the
    # much larger integration/behavioural suite. This job runs the full suite
    # (excluding only the gemini/claude markers, which need external API
    # credentials) on BOTH Linux and Windows, so a green CI no longer implies
    # "every test passed" when only the unit slice ran on a single OS - and so
    # platform-specific test hardcodes are caught automatically. Both hosted
    # runners are symlink-capable, so the symlink-requiring filesystem tests run
    # in full. This is a required status check on both legs: a failure on either
    # OS blocks the merge, so "green" means green on every platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        # bash is available on windows-latest via Git Bash; using it on both
        # OSes keeps the just invocation and argument quoting identical.
        shell: bash
        run: just deps sync

      - name: Run broad test suite
        shell: bash
        run: just test broad

  windows-vault-repair:
    name: Windows Vault Repair Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Run vault repair regression tests
        run: just test vault-repair

  vault-audit:
    name: Vault Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Bootstrap framework
        # The source repo tracks .vaultspec/ framework config, but the install
        # manifest (.vaultspec/providers.json) stays gitignored. A fresh
        # checkout therefore has the framework dir without a manifest, which
        # the diagnosis engine classifies as CORRUPTED. Run install with
        # --force to repair/create the manifest from the tracked config and
        # scaffold provider outputs, the way a consumer recovering a missing
        # manifest would.
        run: just framework install

      - name: Verify vault structure and links
        run: just vault check

  dependency-audit:
    name: Dependency Audit (uv audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Python dependency vulnerability audit
        run: just audit deps
