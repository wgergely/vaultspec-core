name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv for the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: astral-sh/setup-uv@v7

      - name: Regenerate and push uv.lock onto the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push
          fi

      # The push above lands a few seconds after release-please makes the pull
      # request mergeable, so a release merged inside that window ships the
      # previous version's lockfile and leaves main failing every job at
      # dependency install. Main is ruleset-protected and cannot be pushed to
      # directly, so reconcile through a pull request instead of assuming the
      # window was never hit.
      - name: Check out main to verify the released lockfile
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up uv for the lockfile verification
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Open a reconciling pull request when the lockfile drifted
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if uv lock --locked; then
            echo "uv.lock on main matches the released version"
            exit 0
          fi
          echo "::warning::uv.lock on main did not match the released version; opening a reconciling pull request"
          uv lock
          BRANCH="chore/reconcile-uv-lock-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add uv.lock
          git commit -m "chore(deps): reconcile uv.lock with ${TAG}"
          git push --set-upstream origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "chore(deps): reconcile uv.lock with ${TAG}" \
            --body "The release for \`${TAG}\` was merged before the lockfile update reached its branch, so main carries the previous version's \`uv.lock\`. Every job installing with \`--locked\` fails until this merges."
          echo "Opened a lockfile reconciliation pull request for ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch PyPI publish workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "${TAG}" ]; then
            echo "::error::release-please reported release_created=true but tag_name output is empty"
            exit 1
          fi
          echo "Dispatching publish.yml for tag: ${TAG}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -f "ref=${TAG}" \
            -f "inputs[tag]=${TAG}"
          echo "Dispatched publish.yml for ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # Standalone binaries bootstrap by installing the package from PyPI on
      # first run, so this is dispatched alongside publish.yml (not gated on it)
      # - the release must reach PyPI before end users launch a binary, which
      # the paired publish dispatch handles.
      - name: Dispatch binaries build workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "${TAG}" ]; then
            echo "::error::release-please reported release_created=true but tag_name output is empty"
            exit 1
          fi
          echo "Dispatching binaries.yml for tag: ${TAG}"
          # `ref=main`, NOT `ref=${TAG}`, and that distinction is the point.
          #
          # A dispatch resolves the WORKFLOW from `ref`, while binaries.yml's
          # build job checks out `inputs.tag` for the SOURCE. Those answer two
          # different questions:
          #
          #   what to build    the matrix - repository policy, current
          #   what to compile  the tag's tree - the released source
          #
          # Dispatching at the tag freezes BOTH, so a change to the matrix can
          # never reach a release and a repair dispatch rebuilds exactly what
          # failed. vaultspec-core-v0.1.66 is the demonstration: #372 removes
          # the macos-x86_64 leg because that binary exits 1 on launch, and
          # 0.1.66 built and attached it anyway from the tag's four-leg matrix.
          # generate.py then saw complete digests for the triple, emitted the
          # `on_intel` block, and moved the tap onto a binary that cannot start.
          #
          # With `ref=main` the source stays the tag's and the matrix is whatever
          # this repository currently says it builds. It also makes repair work:
          # dispatching again for an older tag picks up any workflow-level fix
          # merged since.
          #
          # vaultspec-rag already does this (its release-please.yml uses
          # `--ref main`). The two disagreed, and this was the brittle half.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/binaries.yml/dispatches" \
            -f "ref=main" \
            -f "inputs[tag]=${TAG}"
          echo "Dispatched binaries.yml for ${TAG}" >> "$GITHUB_STEP_SUMMARY"
