name: Publish

on:
  # Tag-triggered, matching vaultspec-rag. Dispatch-only is what let 0.1.58 and
  # 0.1.59 tag while PyPI stayed on 0.1.57: publishing depended on a human
  # remembering, and nothing went red when they did not. The comment in this
  # file already says a release must not depend on a laptop being plugged in;
  # it should not depend on someone recalling a second dispatch either.
  push:
    tags:
      - "vaultspec-core-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-core-v0.1.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # KEYED BY TAG. An unkeyed group means GitHub holds one running and one
  # pending run, so a third release silently CANCELS the queued one - and a
  # cancelled run reports `cancelled`, not `failed`. This repo cut five
  # releases in five hours on 2026-08-30. binaries.yml already keys its group
  # this way.
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # On the fleet, because this repository uses no GitHub-hosted runners.
    #
    # The distribution is a py3-none-any wheel, so the build host cannot affect
    # the artifact - but availability still matters, and this is the path that
    # let 0.1.58 and 0.1.59 tag while PyPI stayed on 0.1.57. The Linux/X64
    # runner is on the workstation, which is NOT power-gated, so publishing no
    # longer waits on a laptop being plugged in; it does now wait on that one
    # machine being up and free.
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Verify bundled builtins present
        run: |
          if [ ! -d "src/vaultspec_core/builtins/templates" ]; then
            echo "::error::src/vaultspec_core/builtins/ is missing canonical content - wheel build will fail"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: Smoke Test
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl dev/smoke/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz dev/smoke/smoke_check.py

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: [self-hosted, Linux, X64, build]
    environment:
      name: pypi
    permissions:
      # `id-token: write` is for PyPI trusted publishing. `contents: WRITE`,
      # not read, because this job also uploads the wheel and sdist to the
      # GitHub Release - and an asset upload is a write to the repository.
      #
      # Declared `contents: read`, the upload fails with
      #   HTTP 403: Resource not accessible by integration
      # naming an uploads.github.com URL, which reads like a credential problem
      # with PyPI rather than a permission this workflow declines to ask for.
      # v0.1.64 published to PyPI and then failed here, so the distribution
      # reached the index and never reached the release it belongs to.
      id-token: write
      contents: write
      # For the attestation below. `id-token` is already present for PyPI
      # trusted publishing and is reused rather than re-justified; this is the
      # permission that lets the run publish the resulting bundle.
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # ATTESTED BEFORE `uv publish`, because that is the one act in this
      # workflow that cannot be undone. A version pushed to PyPI cannot be
      # unpublished, so an attestation failure afterwards leaves the index
      # holding a distribution the GitHub Release has no wheel, no sdist and no
      # digests for - the v0.1.64 shape the permissions note above was written
      # about. Nothing here needs PyPI: `dist/` is byte-identical either side of
      # the upload, so the ordering costs nothing and buys the guarantee
      # binaries.yml states for its own lane.
      #
      # At this point `dist/` holds exactly the wheel and the sdist -
      # `Generate checksums` has not yet written SHA256SUMS into it - so the
      # subject set needs no exclusion and cannot acquire one by accident. The
      # `! -name SHA256SUMS` predicate below is therefore redundant here, and is
      # kept only so both lanes read identically; a reader comparing them should
      # not have to work out whether the difference is meaningful.
      #
      # SHA256SUMS is deliberately never a subject, in either lane. Both
      # workflows attach it to the same release on the same tag and merge into
      # it, and neither knows which runs last - the merge logic below exists
      # because of that race. An attestation over a file rewritten after it is
      # minted cannot be verified by the user it was minted for.
      - name: Enumerate the distribution to attest
        id: subjects
        run: |
          set -euo pipefail
          mapfile -t subjects < <(
            find dist -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort
          )
          # A build that produced no distribution must not attest nothing and
          # report success.
          if [ ${#subjects[@]} -eq 0 ]; then
            echo "::error::dist holds no attestable file; there is nothing to attest"
            exit 1
          fi
          echo "attesting ${#subjects[@]} file(s): ${subjects[*]}"
          {
            echo "count=${#subjects[@]}"
            echo "paths<<SUBJECTS_EOF"
            printf '%s\n' "${subjects[@]}"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the distribution
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          # MERGE rather than replace. binaries.yml publishes a SHA256SUMS to
          # this same release, and neither workflow knows which runs first -
          # vaultspec-rag v0.4.11 lost its wheel and sdist digests exactly this
          # way, leaving assets on a release with nothing to verify them
          # against. Entries for the files this run publishes are dropped from
          # the inherited copy first, so a re-run replaces its own lines rather
          # than duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

      - name: Ensure the GitHub Release exists
        # release-please normally creates it before this runs, but the tag-push
        # trigger can fire against a tag with no Release yet. --verify-tag
        # refuses to invent one for an unpushed tag; the only failure left once
        # the tag verifies is "already exists", which is the no-op we want.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" --repo "$GITHUB_REPOSITORY"             --verify-tag --generate-notes || true

      - name: Attach the distribution to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "${TAG}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # The instrument, immediately after the upload it speaks for. The attest
      # step can only report that the action exited zero; this asks the API the
      # question a user asks, and it is the reason the claim in the published
      # documentation is now true rather than aspirational.
      - name: Verify the attached distribution carries provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SUBJECTS: ${{ steps.subjects.outputs.paths }}
          EXPECTED: ${{ steps.subjects.outputs.count }}
        run: |
          set -euo pipefail
          unverified=()
          checked=0
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            checked=$((checked + 1))
            # Pinned to the signer workflow, not merely the repository, and
            # stderr kept so a Sigstore or API outage is distinguishable from a
            # missing attestation.
            # `< /dev/null` because this loop's stdin is the subject list.
            if ! why=$(gh attestation verify "${asset}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
              < /dev/null 2>&1); then
              unverified+=("$(basename "${asset}")")
              echo "::warning::${asset} did not verify:"
              printf '%s\n' "${why}" >&2
            fi
          done <<< "${SUBJECTS}"
          if [ "${checked}" -eq 0 ]; then
            echo "::error::no distribution file was checked for provenance; this guard cannot pass vacuously"
            exit 1
          fi
          if [ "${checked}" -ne "${EXPECTED}" ]; then
            echo "::error::verified ${checked} file(s) but ${EXPECTED} were attested; the subject list changed mid-job"
            exit 1
          fi
          if [ ${#unverified[@]} -ne 0 ]; then
            echo "::error::attached but unattested: ${unverified[*]}"
            exit 1
          fi
          echo "all ${checked} distribution file(s) verify against ${GITHUB_REPOSITORY}"
