# Asserts that main's tip commit actually received a CI verdict.
#
# The `Protect Main` ruleset lists ten required status checks, but required
# checks gate PULL REQUEST MERGES only - they do not gate a direct push, and
# admin and deploy-key pushes bypass the PR requirement outright. Most commits
# reach main here by direct push, so the push-triggered CI run is the only
# thing between such a push and an unvalidated main.
#
# On 2026-08-26 that run ended in `startup_failure` - zero jobs, zero logs,
# zero duration - and nothing signalled it. main sat unvalidated until an
# unrelated PR merged on top 80 minutes later and happened to re-validate the
# tree. That was luck, not a mechanism.
#
# This runs on the self-hosted fleet, because this repository uses no
# GitHub-hosted runners. That is a real weakness in a sentinel: it is
# unavailable in some of the conditions it exists to report, and one of the
# three shapes it must catch is a run that was never created because no runner
# picked it up. A fleet-wide outage silences the sentinel along with the CI it
# watches, so a long gap in this job's own schedule is itself a signal.
name: Main CI Sentinel

on:
  schedule:
    # Hourly, off the top of the hour: every repository that asks for "hourly"
    # gets minute 0, and this check has no reason to join that stampede.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: main-ci-sentinel
  cancel-in-progress: false

jobs:
  assert-main-was-validated:
    name: Assert main's tip has a CI verdict
    runs-on: [self-hosted, Linux, X64, build]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Kept in one place: the issue is found again by exact title, which is
      # what stops an hourly schedule opening a new one every hour.
      ISSUE_TITLE: "Main CI Sentinel: main's tip has no passing CI run"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Judge main's tip
        id: judge
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          landed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" \
            --jq '.commit.committer.date')
          age=$(( ( $(date -u +%s) - $(date -u -d "${landed}" +%s) ) / 60 ))

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=50" \
            > runs.json

          # The module is standard-library only, so the sentinel needs nothing
          # provisioned - one less thing that can be the reason it does not run.
          #
          # The verdict is read as a state, never inferred from the exit
          # code. That code is 0 for `healthy` and for `pending` alike,
          # because neither should fail this job - so a boolean derived
          # from it cannot tell "main is green" from "no verdict yet".
          # Reading it that way is how issue #398 was closed as validated
          # while main's tip was red and its CI run was still in flight.
          set +e
          python3 dev/ci_sentinel/main_ci_health.py \
            --commit-age-minutes "${age}" --format key-value \
            < runs.json > verdict.env
          rc=$?
          set -e

          state=$(sed -n 's/^state=//p' verdict.env)
          reason=$(sed -n 's/^reason=//p' verdict.env)

          # A judge that produced no verdict is itself a fault. Without
          # this, a crash leaves `state` empty, every branch below is
          # skipped, and the sentinel reports success having judged
          # nothing.
          case "${state}" in
            healthy | pending | unhealthy) ;;
            *)
              echo "::error::the sentinel produced no verdict (exit ${rc})"
              exit 1
              ;;
          esac

          {
            echo "sha=${sha}"
            echo "state=${state}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"
          echo "${state}: ${reason}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open an issue and fail
        if: ${{ steps.judge.outputs.state == 'unhealthy' }}
        shell: bash
        env:
          SHA: ${{ steps.judge.outputs.sha }}
          VERDICT: ${{ steps.judge.outputs.reason }}
        run: |
          set -euo pipefail
          # Reuse the open issue rather than filing one an hour. A human closing
          # it while main is still unvalidated re-opens a fresh one next tick,
          # which is the right behaviour: the condition, not the paperwork, is
          # what clears it.
          existing=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title --jq \
            "[.[] | select(.title == \"${ISSUE_TITLE}\")] | .[0].number // empty")

          if [ -z "${existing}" ]; then
            gh issue create --title "${ISSUE_TITLE}" --body "$(printf '%s\n' \
              "\`main\` is at \`${SHA}\` and CI has not validated it." \
              "" \
              "> ${VERDICT}" \
              "" \
              "Required status checks gate pull request merges only, so a direct" \
              "push to \`main\` is covered by its push-triggered CI run and nothing" \
              "else. This issue means that run failed, was cancelled, ended in" \
              "\`startup_failure\`, or was never created." \
              "" \
              "It closes itself once \`main\`'s tip has a passing CI run." \
              "" \
              "Opened by \`.github/workflows/main-ci-sentinel.yml\`.")"
          else
            gh issue comment "${existing}" --body \
              "Still unvalidated at \`${SHA}\`: ${VERDICT}"
          fi

          echo "::error::${VERDICT}"
          exit 1

      # Only `healthy` closes. `pending` deliberately does nothing at all:
      # an outstanding verdict is evidence of neither state, so the issue
      # stays open until a run actually succeeds.
      - name: Close the sentinel issue once main is validated again
        if: ${{ steps.judge.outputs.state == 'healthy' }}
        shell: bash
        env:
          SHA: ${{ steps.judge.outputs.sha }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title --jq \
            "[.[] | select(.title == \"${ISSUE_TITLE}\")] | .[0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment \
              "\`main\` is validated again at \`${SHA}\`; closing."
          fi
