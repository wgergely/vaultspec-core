name: Binaries

# BUILDS ON A TAG, not only on dispatch.
#
# Dispatch-only is what let vaultspec-rag-v0.4.12 become `latest` carrying the
# Python distribution and no platform binaries at all: cutting a release simply
# did not build them, and nobody was going to remember. The artifact-less-release
# guard could not catch it either - that guard lives in THIS workflow, and a
# workflow that never runs cannot demote anything. It was unreachable, not
# broken.
#
# vaultspec-dashboard has never had this problem because its release workflow
# runs on tag push. This brings core to the same shape. Dispatch is kept for
# repairing a tag whose build failed.
on:
  push:
    tags:
      - "vaultspec-core-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-core-v0.1.48)"
        required: true
        type: string
      allow_queue:
        description: "Build even if a leg's runner is offline (the job will queue, not fail)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Refuse to start a build whose runners cannot serve it.
  #
  # A job whose `runs-on` matches no ONLINE runner does not fail - it QUEUES,
  # and a queued job is not bounded by `timeout-minutes`, so nothing in this
  # file can rescue it. v0.1.57, v0.1.58 and v0.1.59 ran 19h53m, 24h00m03s and
  # 24h00m03s before failing, and all three shipped no binaries.
  #
  # One of this matrix's three legs lands on the power-gated MacBook, which
  # serves runners only on AC. That is correct behaviour and this job does not
  # fight it - it just refuses to spend a day discovering it. Dispatch again
  # once the host is on AC, or set `allow_queue` to wait deliberately.
  #
  # Hosted, deliberately: a preflight that needs the fleet cannot report that
  # the fleet is down.
  preflight:
    name: Preflight runners
    runs-on: ubuntu-latest
    steps:
      # Only the workflow directory, only this commit: the step below reads the
      # matrix out of this file to learn which selectors it must check.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Every matrix selector has an online runner
        shell: bash
        env:
          # A PAT with `administration: read` if configured; the default token
          # otherwise. The default GITHUB_TOKEN CANNOT read `actions/runners` -
          # that endpoint needs admin - so without the PAT this check is blind
          # and says so rather than guessing.
          # NO FALLBACK. See the block below for why.
          GH_TOKEN: ${{ secrets.FLEET_PREFLIGHT_TOKEN }}
          ALLOW_QUEUE: ${{ inputs.allow_queue }}
        run: |
          # NOT `set -e`. An unobservable preflight must not refuse a build: the
          # `gh api` below returns 403 under the default GITHUB_TOKEN, and under
          # `set -e` that aborts the step and skips everything downstream. It
          # blocked vaultspec-dashboard v0.1.6 exactly that way. A check that
          # cannot tell "no runner" from "cannot see runners" must not speak for
          # the first.
          set -uo pipefail
          # UNOBSERVABLE IS A FAILURE, not a skip. GITHUB_TOKEN can NEVER read
          # actions/runners - that endpoint needs Administration:read, which no
          # `permissions:` value grants it - so the old fallback guaranteed a 403
          # and the skip guaranteed a green job. A check that cannot observe its
          # subject must fail, or it is not a check.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FLEET_PREFLIGHT_TOKEN is not set. This check needs a PAT with Administration:read."
            exit 1
          fi
          if ! runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv' 2>&1); then
            echo "::error::preflight cannot read the runner list: ${runners}"
            exit 1
          fi
          [ -n "${runners}" ] || { echo "::error::no self-hosted runners are registered"; exit 1; }

          # The selectors this matrix actually requires, DERIVED from the
          # matrix rather than hand-listed.
          #
          # The hand-kept list outlived its matrix. It still named
          # `self-hosted,linux,arm64` long after #356 removed that leg: no job
          # in this repository selects that label set any more - not build, not
          # release, not verify-release-assets, not acquisition.yml - but the
          # runner carrying it is still registered. So the first time that host
          # was down while every real leg was up, this check would have taken
          # its `registered>0, online=0` branch and refused a build every leg
          # could serve, citing a target that does not exist.
          #
          # That is the same defect #361/#364 fixed one job below, where a
          # hand-kept target list left `aarch64-unknown-linux-gnu` behind and
          # made v0.1.62 report a false partial. The fix there was to derive
          # from the matrix; this is the same fix for the same reason. A list
          # that must be edited in lockstep with the matrix eventually is not,
          # and neither copy of the mistake was visible in review.
          #
          # This matters more than it looks. FLEET_PREFLIGHT_TOKEN was
          # provisioned on 2026-09-06 and the blind path above is gone, so a
          # stale selector list is no longer harmless - it is now load-bearing
          # and will fail a build rather than being skipped past.
          workflow=".github/workflows/binaries.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive selectors" >&2; exit 1; }
          mapfile -t selectors < <(awk -F'[][]' '/^[[:space:]]*runner:/ && NF > 2 {print $2}' "${workflow}" | tr -d ' ' | tr '[:upper:]' '[:lower:]' | sort -u)
          if [ "${#selectors[@]}" -eq 0 ]; then
            echo "::error::derived no runner selector from ${workflow}; refusing to pass vacuously" >&2
            exit 1
          fi
          printf 'derived selector: %s\n' "${selectors[@]}"

          failed=0
          for want in "${selectors[@]}"; do
            online=0; registered=0
            while IFS=$'	' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in *",${part},"*) ;; *) missing=1; break ;; esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${ALLOW_QUEUE}" = "true" ]; then
              echo "::warning::[${want}] has no online runner; continuing because allow_queue is set."
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by no registered runner." >&2
              failed=1
            else
              echo "::error::[${want}] matches ${registered} runner(s), none online - usually the power-gated host on battery. Dispatch again on AC." >&2
              failed=1
            fi
          done

          [ "${failed}" -eq 0 ] || { echo "::error::preflight refused a build that would queue rather than run" >&2; exit 1; }

  # THE WHEEL COMES FIRST, and that is the reordering this file exists to
  # record. Until now every binary installed `vaultspec-core==<version>` from
  # PyPI on the user's machine at first launch, so publication was a
  # PRECONDITION of the binaries working: a green build could still hand out an
  # artifact that would not start until publish.yml finished propagating.
  #
  # The binaries now carry the application, so the build needs the wheel rather
  # than the index. Building it here rather than downloading it from PyPI keeps
  # publication a PEER of this workflow instead of an upstream of it, and means
  # the bytes a binary carries came from the tag being built rather than from
  # whatever an index served at the moment the matrix ran.
  #
  # One wheel for every leg, not one per leg. `vaultspec-core` is pure Python
  # and its wheel is `py3-none-any`; what differs per target is the dependency
  # closure resolved around it, which each leg resolves for itself. Building it
  # once also means all four binaries embed identical application bytes.
  #
  # HOSTED: this needs no fleet capability, and making it need one would put a
  # queue in front of every leg.
  wheel:
    name: Build the wheel the binaries carry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        shell: bash
        run: uv build --wheel --out-dir dist

      # The tag names a version and so does the wheel. If they disagree, every
      # binary in this release would report a version the release does not
      # carry - and would do it silently, because nothing downstream re-reads
      # the tag once the wheel is an artifact.
      - name: The wheel is the version the tag names
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#vaultspec-core-v}"
          version="${version#v}"
          expected="vaultspec_core-${version}-py3-none-any.whl"
          if [ ! -f "dist/${expected}" ]; then
            echo "::error::${TAG} expects dist/${expected}; built: $(ls dist)"
            exit 1
          fi
          echo "wheel ${expected} matches ${TAG}"

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: project-wheel
          path: dist/
          if-no-files-found: error
          retention-days: 5

  build:
    needs: [preflight, wheel]
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary's minimum glibc is whatever its build machine happens
          # to offer, so this leg builds inside an image pinned at the floor
          # dev/binaries/build_pyapp.py declares rather than on the runner,
          # whose glibc moves whenever the host is upgraded. The builder
          # re-reads the floor off the artifact and fails the job if it is
          # exceeded, so the image and that declaration cannot drift apart
          # silently. Pinned by digest: the build environment is downloaded and
          # executed, so a mutable tag is not an acceptable input.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          # Same manylinux RELEASE as the leg above (2026.08.24-1), not merely
          # the same floor. Two legs pinned to different builds of the toolchain
          # can differ in ways the floor check does not measure, and the whole
          # point of pinning is that the build environment is an input.
          #
          # HOSTED, and the only leg that is. See the note below `runs-on` for
          # why that is now the honest choice rather than a concession.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            container: ""
          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            container: ""
          # macos-x86_64 IS DROPPED, and the artifact it produced is why.
          #
          # It cross-built on the Apple Silicon runner and attached cleanly for
          # months. vaultspec-core#365 executed the published v0.1.63 asset and
          # it exits 1: the bootstrap installs `cryptography`, which publishes
          # macOS wheels for arm64 ONLY, so on x86_64 it falls back to a source
          # build needing a Rust toolchain that is not there. Rosetta 2 runs the
          # Mach-O correctly - the architecture was never the problem.
          #
          # The alternative was holding `cryptography` back to a release with an
          # x86_64 macOS wheel. Pinning a SECURITY library backwards to serve a
          # platform Apple stopped selling in 2023 is the worse trade, and the
          # Homebrew formula was meanwhile offering Intel users a binary that
          # does not start - worse than offering none.
          #
          # HOMEBREW_TARGETS deliberately still names the triple, exactly as it
          # does for the absent linux-aarch64 leg: generate.py prints a
          # `::warning::` naming the gap on every release and omits the platform
          # from the formula rather than pinning an asset that was never built.
          # The gap stays visible instead of being quietly erased.
          #
          # Intel macOS retains a working acquisition path: `pip install
          # vaultspec-core` from PyPI, which is a source-compatible install
          # rather than a frozen binary.
          #
          # Restore this leg in the same change that settles the dependency -
          # not before, or it ships a binary that exits 1 again.
          # Linux ARM64 runs in a colima container on macbook neo, registered
          # as `macbook-neo-linux-arm-core` and provisioned by
          # ~/action-runners/containers/vaultspec-core-linux-arm/runner-entry.sh
          # on that host. It is enrolled in the host's two fleet scripts, which
          # is what makes it a fleet member rather than a stray runner:
          # runner-powergate.sh (AC-only policy) and runner-deploy-hooks.sh
          # (post-job disk hygiene).
          #
          # THE FLEET SERVES ONLY ON AC POWER. On battery the gate stops every
          # runner on this host once it is idle - it never kills a running job -
          # and GitHub queues new ones until AC returns. So a release dispatched
          # while the laptop is unplugged does not fail, it waits. That is true
          # of the macOS legs above as well; this leg is not special.
          #
          # THIS HOST STILL CANNOT SERVE linux-aarch64, and that has not
          # changed - the leg above simply stopped asking it to.
          #
          # The colima-hosted ARM64 runner has no reachable docker daemon, so a
          # pinned manylinux image dies in `Initialize containers` before
          # checkout; and an uncontainerised build there produces an artifact
          # requiring GLIBC_2.39 against a declared floor of 2.28. Both routes
          # were closed, which is why this leg was absent rather than broken.
          #
          # The standing note said to restore it "the moment this label is
          # served by a host that can run the pinned image". That host was
          # always available: `ubuntu-24.04-arm` is a GitHub-hosted ARM64
          # runner with a working docker daemon, and it is FREE for public
          # repositories - which this repository is. The blocker was never the
          # gap analysis above, all of which still holds; it was the blanket
          # "hosted runners are cost-prohibitive" assumption recorded under
          # `runs-on`, which is true of private repositories and was carried
          # over to this one without being re-checked.
          #
          # `HOMEBREW_TARGETS` already named this triple and `generate.py` has
          # been printing `::warning::no Homebrew coverage for:
          # aarch64-unknown-linux-gnu` on every release. That warning should
          # now stop by itself; if it does not, the asset name and the formula
          # disagree and that is a real defect, not a leftover.
    # Artifact builds run on the shared self-hosted fleet, with ONE exception:
    # linux-aarch64 runs on a GitHub-hosted ARM64 runner because no host in
    # this fleet can build that target to its declared floor.
    #
    # The note this replaces said hosted multiplatform runners are
    # "cost-prohibitive". That is true for private repositories, where ARM64
    # and macOS hosted minutes bill at a multiplier. It is NOT true here:
    # hosted runners are free for public repositories, and this one is public.
    # The claim was correct where it was first written and was then applied to
    # a repository it did not describe, which cost this project one build
    # target for as long as it stood.
    #
    # publish.yml carries the same sentence for the same reason; it is worth
    # re-reading there rather than assuming it transfers.
    runs-on: ${{ matrix.runner }}
    # Empty for every leg but the two Linux ones, which GitHub reads as
    # "no container".
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download the wheel the binaries carry
        uses: actions/download-artifact@v8
        with:
          name: project-wheel
          path: dist

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Exactly one wheel, named rather than globbed into the command. A
          # glob that matched two would pass both to the builder as one
          # argument and the failure would surface as a resolver error about a
          # path nobody wrote.
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::expected one wheel in dist/, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          uv run --no-project --python 3.13 -- \
            python dev/binaries/build_pyapp.py --tag "${TAG}" --target "${TARGET}" \
              --wheel "${wheels[0]}" --outdir dist-bin

      # UNVERIFIED, deliberately, and the name is the contract. Nothing
      # downstream attaches an artifact under this name; the offline gate below
      # is what renames it to `binaries-*`, so an artifact that has not been run
      # with the network taken away cannot reach a release by any path that
      # skips a step. `binaries-*` means "proved offline", not "compiled".
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: unverified-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 1

      # A containerised leg runs as root, and its workspace is the SAME
      # directory the runner reuses for every other job on that machine. Left
      # alone it hands the next non-container job a tree it has no permission
      # to clean, and that job dies in `Checkout` on `unlink '.git/FETCH_HEAD'`
      # - which is how `Attach to release` failed after a release built fine.
      # `/__w` is created by the runner and keeps the runner's ownership, so it
      # is the reference for what the tree should look like on the way out.
      # Runs on failure too: a leg that dies mid-build poisons the tree just as
      # thoroughly as one that succeeds.
      - name: Return the workspace to the runner's user
        if: ${{ always() && matrix.container != '' }}
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE"

  # THE GATE. An artifact becomes a release asset only by passing through here.
  #
  # #340 reported binaries advertised as standalone that fail on a host with no
  # network, and the reason nothing caught it is that nothing ever took the
  # network away. A `--version` on a connected runner passes whether the
  # artifact carries its application or downloads it, so the green check spoke
  # to neither. This is the check that speaks to the property.
  #
  # It is also why the build leg uploads `unverified-*`: the rename to
  # `binaries-*` happens HERE, on success, so "attached to a release" and
  # "started with the network taken away" are the same event rather than two
  # that a reordering could separate. A leg that fails this produces no
  # `binaries-*` artifact, so `Attach to release` simply does not see it and the
  # completeness assertion at the end of that job reports the release as
  # partial - the same handling a leg that failed to compile already gets.
  #
  # The matrix repeats the build matrix's `name`/`runner`/`target`, which this
  # repository has been bitten by twice (#361/#364, and the preflight selector
  # list). ci.yml asserts on every pull request that the two agree, so a target
  # added to one and not the other goes red on the branch that adds it rather
  # than at release time.
  offline:
    needs: build
    name: Offline ${{ matrix.name }}
    # `!cancelled()` rather than the default, so one leg failing to compile
    # does not skip the gate for the three that did. The cost is that a leg
    # whose build failed also goes red HERE, on a missing `unverified-*`
    # artifact. That is the deliberate trade: the alternative - skipping
    # quietly when there is nothing to check - is a job that reports success
    # having checked nothing, which is the shape this file refuses in four
    # other places.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ISOLATION differs per platform because the platforms differ in what
          # they can take away from one process, and pretending otherwise would
          # be the false-assurance shape this repository keeps removing.
          #
          # `netns` is the real thing: `docker run --network none` gives the
          # process an empty network namespace with a loopback and nothing else,
          # so there is no route, no resolver and no proxy to fall back to. It
          # runs in the SAME pinned manylinux image the artifact was built in,
          # which means this run also exercises the declared GLIBC_2.28 floor
          # rather than the runner's newer libc.
          #
          # These legs are UNCONTAINERISED on purpose, unlike their build
          # counterparts: `unshare --net` inside a container job is refused by
          # the default seccomp profile, so the isolation has to be created by
          # the docker daemon on the host rather than from inside a container it
          # already started.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            isolation: netns
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            isolation: netns
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
          # `sandbox` is macOS's per-process equivalent: a seatbelt profile that
          # allows everything except `network*`, applied to this one process
          # without touching the host. `sandbox-exec` is documented as
          # deprecated and has been for a decade; if Apple removes it this step
          # fails rather than silently stopping isolating, which is the correct
          # direction to fail in.
          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            isolation: sandbox
            image: ""
          # `proxy` is the WEAK one and it is labelled weak. Windows has no
          # unprivileged per-process network isolation - the alternatives are a
          # firewall rule, which needs administrator rights on a shared fleet
          # host and can outlive a cancelled job, or a Windows container, which
          # nothing in this fleet is known to serve. So this leg black-holes
          # every proxy variable the bootstrapper's HTTP client reads and
          # asserts that a cold start still works and fetched nothing. That
          # catches the failure #340 reported; it does not prove the absence of
          # a network path the way the two legs above do. The property itself is
          # platform-independent - it is one branch in PyApp's shared Rust, and
          # the flags that select it are asserted per target in
          # dev/binaries/tests - so what is missing here is a second measurement
          # of a property already measured, not the only measurement of it.
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            isolation: proxy
            image: ""
    runs-on: ${{ matrix.runner }}
    steps:
      # THIS JOB DOES NOT CHECK OUT, so on a self-hosted runner it inherits
      # whatever the last job left in the workspace - including the sentinel
      # the check below writes. A stale one would let this job publish an
      # artifact on the strength of a previous run's evidence.
      - name: Clear evidence left by an earlier run on this machine
        shell: bash
        run: rm -rf offline-verified offline-check.sh dist-bin

      - name: Download the built artifact
        uses: actions/download-artifact@v8
        with:
          name: unverified-${{ matrix.name }}
          path: dist-bin

      # `actions/download-artifact` does not carry the execute bit. Without
      # this the run below fails as "permission denied" on every Unix leg,
      # which looks exactly like a broken artifact.
      - name: Restore the execute bit
        if: ${{ matrix.isolation != 'proxy' }}
        shell: bash
        run: chmod +x dist-bin/vaultspec-core-* dist-bin/vaultspec-mcp-*

      - name: Run it with no network at all
        if: ${{ matrix.isolation == 'netns' }}
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Pulled here, WITH network, because `--network none` cannot pull.
          docker pull "${IMAGE}"
          cat > offline-check.sh <<'CHECK'
          set -eux
          # VACUITY GUARD. If this container could reach the network, every
          # assertion below would pass while proving nothing - which is the
          # exact shape of the green check that let #340 ship. Prove the
          # network is gone before concluding anything from its absence.
          if curl --silent --show-error --max-time 10 https://pypi.org > /dev/null 2>&1; then
            echo "::error::this container reached the network; --network none is not isolating and this gate would pass vacuously"
            exit 1
          fi
          echo "confirmed: no network reachable from this container"

          # A COLD start. The artifact unpacks itself into a data directory on
          # first run, so a warm one would prove only that a previous run
          # worked.
          export HOME=/tmp/fresh-home
          rm -rf "$HOME"; mkdir -p "$HOME"

          /artifacts/vaultspec-core-"${TARGET}" --version

          # Behaviour, not exit codes. `--version` can be answered without
          # importing much; `install` and `vault check` pull in the dependency
          # closure - pydantic, rustworkx, PyYAML and the rest - which is the
          # part that used to arrive over the network.
          rm -rf /tmp/proj; mkdir -p /tmp/proj; cd /tmp/proj
          git init -q
          git config user.email offline@example.invalid
          git config user.name "Offline Gate"
          /artifacts/vaultspec-core-"${TARGET}" install
          [ -d .vault ] || { echo "::error::install exited zero but scaffolded no .vault/"; exit 1; }
          /artifacts/vaultspec-core-"${TARGET}" vault check all

          # #340's symptom by name: the first launch fetched `uv` before it
          # fetched anything else. Nothing should have appeared.
          if find "$HOME" -name 'uv' -o -name 'uv.exe' | grep -q .; then
            echo "::error::an installer was materialised under $HOME; this artifact still expects to install at launch"
            exit 1
          fi
          echo "offline run complete: the artifact carried everything it needed"
          CHECK
          docker run --rm --network none \
            --env "TARGET=${TARGET}" \
            -v "${PWD}/dist-bin:/artifacts:ro" \
            -v "${PWD}/offline-check.sh:/offline-check.sh:ro" \
            "${IMAGE}" bash /offline-check.sh
          echo "netns" > offline-verified

      - name: Run it with the network denied to the process
        if: ${{ matrix.isolation == 'sandbox' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # `allow default` then `deny network*`: later rules win in SBPL, so
          # this is "everything except the network".
          profile='(version 1)(allow default)(deny network*)'
          # VACUITY GUARD, as above: a profile that stopped isolating would
          # make every assertion below vacuous.
          if sandbox-exec -p "${profile}" curl --silent --show-error --max-time 10 https://pypi.org > /dev/null 2>&1; then
            echo "::error::the seatbelt profile did not deny the network; this gate would pass vacuously"
            exit 1
          fi
          echo "confirmed: the network is denied inside this profile"

          home="${RUNNER_TEMP}/offline-home"
          project="${RUNNER_TEMP}/offline-project"
          rm -rf "${home}" "${project}"
          mkdir -p "${home}" "${project}"
          binary="${PWD}/dist-bin/vaultspec-core-${TARGET}"

          HOME="${home}" sandbox-exec -p "${profile}" "${binary}" --version

          cd "${project}"
          git init -q
          git config user.email offline@example.invalid
          git config user.name "Offline Gate"
          HOME="${home}" sandbox-exec -p "${profile}" "${binary}" install
          [ -d .vault ] || { echo "::error::install exited zero but scaffolded no .vault/"; exit 1; }
          HOME="${home}" sandbox-exec -p "${profile}" "${binary}" vault check all

          if find "${home}" -name 'uv' | grep -q .; then
            echo "::error::an installer was materialised under ${home}; this artifact still expects to install at launch"
            exit 1
          fi
          echo "offline run complete: the artifact carried everything it needed"
          echo "sandbox" > "${GITHUB_WORKSPACE}/offline-verified"

      - name: Run it with every route to an index black-holed
        if: ${{ matrix.isolation == 'proxy' }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Port 9 is discard, and nothing is listening on it here. Every
          # variable PyApp's HTTP client consults is set, so any attempt to
          # fetch an installer or a package fails instead of succeeding
          # quietly.
          $blackhole = 'http://127.0.0.1:9'
          $env:HTTP_PROXY = $blackhole
          $env:HTTPS_PROXY = $blackhole
          $env:ALL_PROXY = $blackhole
          $env:http_proxy = $blackhole
          $env:https_proxy = $blackhole
          $env:all_proxy = $blackhole
          $env:NO_PROXY = ''
          $env:no_proxy = ''

          # VACUITY GUARD: if a fetch still succeeds under these variables the
          # black hole is not one, and everything below would pass vacuously.
          & curl.exe --silent --show-error --max-time 10 https://pypi.org --output $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::a request reached the network through the black hole; this gate would pass vacuously"
            exit 1
          }
          Write-Output "confirmed: HTTP is black-holed for this process tree"

          # A COLD start, as far as Windows allows one to be arranged.
          # Redirecting LOCALAPPDATA is best-effort here and not the same
          # instrument the Unix legs use: PyApp resolves its data directory
          # through the known-folder API, which reads the user profile rather
          # than the environment, so a redirected variable may be ignored. The
          # start is cold anyway because PyApp's directory is per-version and
          # this version has never run on this host - and the search below
          # covers BOTH candidate roots so it cannot miss an installer by
          # having looked in a directory the artifact never used.
          $home_dir = Join-Path $env:RUNNER_TEMP 'offline-home'
          $project = Join-Path $env:RUNNER_TEMP 'offline-project'
          Remove-Item -Recurse -Force $home_dir, $project -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $home_dir, $project | Out-Null
          $real_local = [Environment]::GetFolderPath('LocalApplicationData')
          $env:LOCALAPPDATA = $home_dir
          $env:APPDATA = $home_dir

          $binary = Join-Path $PWD "dist-bin/vaultspec-core-$env:TARGET.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "the artifact could not report its version with no index reachable" }

          Set-Location $project
          git init -q
          git config user.email offline@example.invalid
          git config user.name "Offline Gate"
          & $binary install
          if ($LASTEXITCODE -ne 0) { throw "the artifact could not install a vault with no index reachable" }
          if (-not (Test-Path '.vault')) { throw "install exited zero but scaffolded no .vault/" }
          & $binary vault check all
          if ($LASTEXITCODE -ne 0) { throw "the artifact could not read back what it wrote" }

          # #340's symptom by name, searched in both places the artifact could
          # have put it. Scoped to PyApp's own directory rather than to the
          # whole of LocalAppData, because this runner installs `uv` for the
          # BUILD and finding that one would fail the gate for the opposite of
          # the reason it exists.
          $roots = @($home_dir, $real_local) |
            Sort-Object -Unique |
            ForEach-Object { Join-Path $_ 'pyapp' } |
            Where-Object { Test-Path $_ }
          $fetched = $roots | ForEach-Object {
            Get-ChildItem -Path $_ -Recurse -Filter 'uv.exe' -ErrorAction SilentlyContinue
          }
          if ($fetched) {
            Write-Output "::error::an installer was materialised at $($fetched[0].FullName); this artifact still expects to install at launch"
            exit 1
          }
          Write-Output "offline run complete: the artifact carried everything it needed"
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'offline-verified') -Value 'proxy'

      # THE GATE MUST HAVE RUN, not merely not failed. Each check above is
      # selected by `matrix.isolation`, so a row carrying a value none of them
      # matches would skip all three and arrive at the publish below having
      # proved nothing - a green job that checked an artifact it never
      # executed, which is the exact shape this file removes everywhere else.
      # The sentinel is written by the check itself, as its last act, so
      # "an artifact was verified" and "a step ran" cannot come apart.
      - name: A check actually ran
        shell: bash
        env:
          ISOLATION: ${{ matrix.isolation }}
        run: |
          set -euo pipefail
          if [ ! -f offline-verified ]; then
            echo "::error::no offline check ran for isolation='${ISOLATION}'; this job was about to publish an artifact nothing executed"
            exit 1
          fi
          echo "verified under isolation: $(cat offline-verified)"

      # ONLY reached when every step above passed, because nothing here is
      # `if: always()`. This rename is the gate's whole enforcement mechanism.
      - name: Publish the verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Attach to release
    # `offline`, not `build`: this job attaches `binaries-*`, and that name is
    # now produced by the offline gate rather than by the compile. Depending on
    # `build` would let a release attach an artifact whose gate had not
    # finished.
    needs: offline
    # Runs even when a leg failed, deliberately. `needs:` alone SKIPS this job
    # on any leg failure, which throws away every binary that did build:
    # vaultspec-core-v0.1.61 had four green legs - windows, both macOS, and
    # linux-x86_64 - and published zero assets because linux-aarch64 could not
    # initialise its container. Four working artifacts were discarded to punish
    # a fifth.
    #
    # Attaching a partial set is coherent with how this repo already treats a
    # half-built matrix: dev/packaging omits an unbuilt platform from the
    # channel pointers rather than inventing an asset for it, so the manifests
    # stay truthful about a partial release. What must NOT happen is a partial
    # release going green, so the completeness check below fails the job AFTER
    # the assets are up.
    #
    # This is also what makes the offline gate enforcing rather than advisory.
    # A leg that fails it uploads no `binaries-*` artifact at all, so the
    # download below cannot see it, the release cannot carry it, and the
    # completeness check reports the release as partial - without this job
    # needing to know that an offline gate exists.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
      # Both are for the attestation below. `id-token` mints the OIDC token
      # Sigstore exchanges for a short-lived signing certificate; `attestations`
      # is what lets the run publish the resulting bundle against this
      # repository. Neither is a code-signing credential and neither can become
      # one - see the step for why that distinction matters here.
      id-token: write
      attestations: write
    steps:
      # This repo, for the generator itself. No deploy key and no push: the
      # channel pointers no longer live here.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # The ORG-WIDE distribution repository, which is where Scoop manifests
      # and Homebrew formulae belong. `nevenincs/homebrew-tap` serves both
      # package managers for every product under the account, so a user taps or
      # bucket-adds ONCE, ever - not once per product.
      #
      # Publishing into the product repo instead, as this workflow used to,
      # costs two things its own README argues against: it multiplies that
      # one-time step by the number of products, and it commits to a public
      # product repo's default branch on every release. The odd-looking name is
      # the whole price of the arrangement - Homebrew's one-argument tap form
      # requires a `homebrew-` prefix, and Scoop constrains nothing, so one
      # repository satisfies both.
      - name: Checkout the distribution repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-bin/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        env:
          # Needed by the merge at the end of this step. Without them
          # `gh release download` fails, the merge no-ops, and that is
          # indistinguishable from success.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # With partial attach allowed, "no artifacts at all" is now reachable -
          # every leg failed. Say that plainly rather than dying on a glob that
          # matched nothing.
          if [ -z "$(ls -A dist-bin 2>/dev/null)" ]; then
            echo "::error::no build leg produced an artifact; there is nothing to attach"
            exit 1
          fi
          cd dist-bin
          # Per-asset .sha256 files are produced by build_pyapp.py; fold them
          # into one sha256sum-compatible manifest and drop the fragments.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # The generator raises on a CR, but SHA256SUMS is published as an
          # asset in its own right and consumed by `sha256sum -c` directly, so
          # it is verified here too - a CR lands inside an asset name and makes
          # that entry match nothing for anyone verifying a download by hand.
          if LC_ALL=C grep -q $'\r' SHA256SUMS; then
            echo "::error::SHA256SUMS contains a carriage return; a builder wrote CRLF"
            LC_ALL=C grep -n $'\r' SHA256SUMS >&2
            exit 1
          fi
          # Every uploaded asset must be described, and every described digest
          # must match the bytes about to be published. This is the only place
          # the manifest and the artifacts are both in hand.
          for asset in *; do
            [ "$asset" = "SHA256SUMS" ] && continue
            if ! awk -v a="$asset" '$2 == a { found = 1 } END { exit !found }' SHA256SUMS; then
              echo "::error::${asset} is being uploaded with no SHA256SUMS entry"
              exit 1
            fi
          done
          sha256sum -c SHA256SUMS

          # MERGE only after the local verification above. publish.yml writes a
          # SHA256SUMS to this same release for the wheel and sdist, and neither
          # workflow knows which runs first - vaultspec-rag v0.4.11 lost its
          # distribution digests exactly that way. Merging BEFORE the check
          # would break it instead: `sha256sum -c` verifies every line, and the
          # inherited entries name files that are not in this directory.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ATTESTED BEFORE UPLOAD, and the ordering is the guard. `actions/attest`
      # failing here fails the job with `gh release upload` still unrun, so an
      # asset that could not be attested never becomes a release asset.
      #
      # THIS IS NOT A SIGNATURE, and reading it as one would be the expensive
      # mistake. Sigstore is not in the Microsoft Trusted Root Program and is
      # not going to be, so nothing here moves SmartScreen, Gatekeeper, or a
      # WDAC publisher rule. The publisher-identity half is #405 and it is
      # parked on a certificate this project does not hold.
      #
      # What it does do is the half that needed no certificate. Until now a user
      # comparing a download against SHA256SUMS learned only that the file
      # matched a list published beside it - which a tampered release publishes
      # just as happily. An attestation binds each asset's digest to THIS
      # repository and THIS workflow run, checkable with `gh attestation verify`
      # by someone who trusts neither.
      #
      # SHA256SUMS IS DELIBERATELY NOT ATTESTED, and the reason is already
      # written into publish.yml: that workflow attaches the wheel and sdist to
      # this same release and merges their digests into this same file, and
      # neither workflow knows which runs first. Whichever finishes last
      # replaces the asset. An attestation over a file rewritten after it is
      # minted is one a user cannot verify - `gh attestation verify` would fail
      # on the single asset whose whole purpose is to be checked. It is a
      # co-authored, mutable manifest; provenance belongs on the immutable
      # artifacts it describes, not on the description.
      #
      # The subject list is therefore derived and passed explicitly rather than
      # globbed. A glob would have to express that exclusion in `@actions/glob`
      # negation syntax, whose behaviour this repository would then be trusting
      # unverified. An enumerated list is assertable here, in the shell, before
      # anything is signed.
      # M4: the verify step below runs `gh attestation verify --signer-workflow`
      # on the fleet, and the fleet's `gh` is not pinned by anything in this
      # repository. An older one exits non-zero with "unknown flag", every asset
      # lands in `unverified`, and the release fails AFTER upload for a reason
      # that has nothing to do with provenance. Asked here, before the first
      # irreversible act, the same shortfall is one named error instead.
      #
      # Measured on `vaultspec-core-linux` while writing this: gh 2.97.0, the
      # subcommand present, and every Sigstore and GitHub endpoint an
      # attestation needs reachable from that host. This step exists so that
      # stays true rather than having been true once.
      - name: Require a gh that can verify attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "gh: $(gh --version | head -1)"
          if ! gh attestation verify --help > /dev/null 2>&1; then
            echo "::error::this runner's gh has no 'attestation verify'; upgrade gh on the fleet host"
            exit 1
          fi
          if ! gh attestation verify --help 2>&1 | grep -q -- '--signer-workflow'; then
            echo "::error::this runner's gh does not support --signer-workflow; upgrade gh on the fleet host"
            exit 1
          fi
          echo "gh can verify attestations and pin a signer workflow"

      - name: Enumerate the assets to attest
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t subjects < <(
            find dist-bin -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort
          )
          # A derivation yielding nothing would attest nothing and report
          # success - the shape v0.1.60's empty-hash manifest took out of a
          # green run, and the shape the target derivation below already
          # refuses. Say the number rather than trusting the glob.
          if [ ${#subjects[@]} -eq 0 ]; then
            echo "::error::dist-bin holds no attestable asset; there is nothing to attest"
            exit 1
          fi
          echo "attesting ${#subjects[@]} asset(s): ${subjects[*]}"
          {
            echo "count=${#subjects[@]}"
            echo "paths<<SUBJECTS_EOF"
            printf '%s\n' "${subjects[@]}"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the release binaries
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "${TAG}" dist-bin/* --clobber

      # The instrument, and it now runs whenever the upload ran.
      #
      # It used to sit at the end of this job, which put it AFTER the
      # partial-release assertion - a step that exits 1 by design on exactly the
      # release shape this file was built to handle. On every partial release,
      # the case this workflow names v0.1.61 and v0.1.64 for, provenance was
      # therefore never checked at all, while the release and its channel
      # pointers shipped regardless. A correct check placed where it does not
      # execute is this repository's most common defect, and that placement
      # reproduced it inside the change that introduced it.
      #
      # Here it is fail-closed for the package-manager path and costs users
      # nothing. The assets are already attached and downloadable by the time
      # this runs, so the "attach what built rather than withhold it" rule below
      # is untouched. What it can still stop is the channel pointers being
      # generated and pushed to the SHARED distribution branch for a release
      # whose provenance does not verify - that branch serves every product
      # under the account, and a bad pointer on it is the one consequence of
      # this job that is not confined to this release.
      #
      # The attest step above can only report that the action it invoked exited
      # zero. This asks the API the same question a user's `gh attestation
      # verify` asks, about the subjects that were actually attested rather than
      # whatever a glob happened to match.
      - name: Verify the attested assets carry provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SUBJECTS: ${{ steps.subjects.outputs.paths }}
          EXPECTED: ${{ steps.subjects.outputs.count }}
        run: |
          set -euo pipefail
          unverified=()
          checked=0
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            checked=$((checked + 1))
            # Verified against the REPOSITORY and the SIGNER WORKFLOW. `--repo`
            # alone accepts a bundle minted by any workflow in this repository
            # that can obtain `id-token: write`, which is a weaker claim than
            # the one being made here.
            #
            # stderr is CAPTURED, not discarded. Sent to /dev/null, a Sigstore
            # TUF outage, an API 5xx, or a `gh` too old for this subcommand all
            # report identically to a missing attestation, and the release
            # engineer is told the assets are unattested when the truth is that
            # nothing could be asked.
            # `< /dev/null` because this loop's stdin is the subject list.
            # `gh attestation verify` does not read stdin today; a future
            # version that did would silently eat the remaining subjects.
            if ! why=$(gh attestation verify "${asset}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/binaries.yml" \
              < /dev/null 2>&1); then
              unverified+=("$(basename "${asset}")")
              echo "::warning::${asset} did not verify:"
              printf '%s\n' "${why}" >&2
            fi
          done <<< "${SUBJECTS}"
          # Same refusal as the derivation above: a loop that examined nothing
          # reports success having checked nothing.
          if [ "${checked}" -eq 0 ]; then
            echo "::error::no asset was checked for provenance; this guard cannot pass vacuously"
            exit 1
          fi
          # The attest step and this loop read the same derived list, so a
          # disagreement means the list changed between them - which would make
          # both the attestation and this verdict describe a set nobody chose.
          if [ "${checked}" -ne "${EXPECTED}" ]; then
            echo "::error::verified ${checked} asset(s) but ${EXPECTED} were attested; the subject list changed mid-job"
            exit 1
          fi
          if [ ${#unverified[@]} -ne 0 ]; then
            echo "::error::attached but unattested: ${unverified[*]}"
            echo "### Unattested assets" >> "$GITHUB_STEP_SUMMARY"
            echo "Attached to \`${TAG}\` with no verifiable provenance: \`${unverified[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all ${checked} attested asset(s) verify against ${GITHUB_REPOSITORY}"

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of a
      # green run. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # --root is why this needed no generator change: the paths were
          # always parameterised (root/bucket/<product>.json,
          # root/Formula/<product>.rb) and only the workflow assumed they were
          # this repository's.
          uv run --no-project --python 3.13 --             python -m dev.packaging.generate               --tag "${TAG}"               --checksums dist-bin/SHA256SUMS               --root channels

      # Between generating the pointers and committing them, which is the
      # only point where a bad pointer can still be STOPPED rather than
      # reported afterwards.
      #
      # This assertion used to live in dev/packaging/tests, reading this
      # repository's own bucket/ and Formula/. Those are gone - the channel
      # root is per-account, not per-product - and the test kept passing
      # against files nothing wrote any more. Green, and guarding nothing.
      - name: Refuse an uninstallable channel pointer
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -m dev.packaging.validate --root channels

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd channels

          # Stage only THIS product's two files. The distribution repo serves
          # every product under the account, so `git add -- bucket Formula`
          # would sweep up a sibling's pointer if two releases raced, and
          # publish it under this tag's commit message.
          git add -- bucket/vaultspec-core.json Formula/vaultspec-core.rb

          # Compare the INDEX against HEAD, not the worktree. `git diff` reports
          # only tracked paths, so on the first release into a channel - when
          # these files are new and nothing tracks them yet - it reports no
          # change and this step exits zero having published nothing. That is
          # not hypothetical here: the distribution repo currently holds two
          # .gitkeep files and nothing else, so the first run WILL be that case.
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi

          # Identity passed to this one commit rather than persisted. This
          # runner is self-hosted and its checkout is reused by later jobs, so a
          # `git config` identity outlives the run.
          git -c user.name="github-actions[bot]"               -c user.email="github-actions[bot]@users.noreply.github.com"               commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # Rebase-and-retry, and it matters more here than it did in-repo.
          # This branch is now shared by EVERY product under the account, so the
          # racing commit is no longer just an unrelated push to this repo - it
          # is a sibling product publishing its own pointer. Per-product staging
          # above means such a rebase never carries someone else's file, and the
          # generator's backward-bump refusal still stops a stale re-run from
          # clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
      # The matrix is only complete when every declared target attached. This
      # runs LAST on purpose. The binaries that built are more useful on the
      # release than withheld, and the channel generator already omits an
      # unbuilt platform rather than pinning an asset that was never made - so
      # letting the pointers regenerate first leaves them truthful about a
      # partial release instead of stale about a whole one. The red run is what
      # says the set is short; silence would let partial read as complete.
      - name: Assert every declared target attached
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The triples the matrix in this same file actually builds, read
          # from the workflow rather than repeated here. A hand-kept copy is
          # what made vaultspec-core-v0.1.62 report a PARTIAL release: the
          # aarch64-unknown-linux-gnu leg was dropped from the matrix and its
          # expectation was left behind, so the assertion failed on a target
          # nothing was building any more.
          #
          # That target is back in the matrix, on a hosted arm64 runner that can
          # start the pinned manylinux image. It was absent for as long as the
          # only arm64 host was a container with no reachable docker daemon,
          # where an uncontainerised build produced GLIBC_2.39 against a
          # declared 2.28 floor. Deriving is what made both the removal and the
          # restoration cost one edit instead of two.
          workflow=.github/workflows/binaries.yml
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          # A derivation that yields nothing would turn this guard into a no-op
          # that passes every release. Refuse to run rather than pass vacuously.
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::No build targets found in ${workflow}; the partial-release assertion cannot run"
            exit 1
          fi
          echo "Derived ${#expected[@]} target(s) from ${workflow}: ${expected[*]}"
          missing=()
          for triple in "${expected[@]}"; do
            # Glob rather than `ls | grep`: shellcheck SC2010, and the glob is
            # also correct for filenames a word-split `ls` would mangle.
            found=0
            for asset in dist-bin/*"${triple}"*; do
              [ -e "${asset}" ] || continue
              found=1
              break
            done
            [ "${found}" -eq 1 ] || missing+=("${triple}")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::${TAG} is a PARTIAL release. Attached what built; missing: ${missing[*]}"
            echo "### Partial release" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing targets: \`${missing[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all ${#expected[@]} declared targets attached to ${TAG}"

  # A release with no artifacts must not serve as `latest`.
  #
  # This is the fault that cost two releases today. vaultspec-core-v0.1.61 was
  # published by release-please, Binaries had not been dispatched for it, and the
  # empty release immediately became `latest` - where the README badges, the
  # install prose and the channel manifests all point. Nothing went red, because
  # nothing was watching. vaultspec-rag-v0.4.11 did the same thing an hour later.
  #
  # Ported from vaultspec-dashboard, which already carries this guard, adapted to
  # this repo's dispatch-driven shape: there is no `plan` job here, so the tag
  # itself says whether a prerelease was intended.
  #
  # Demotion is reversible and lossless. A prerelease keeps the tag, the notes
  # and the URL intact and reachable; it only stops that release answering as
  # `latest`. Re-dispatch after fixing the build and the promote step undoes it.
  verify-release-assets:
    name: Verify the release carries artifacts
    needs: release
    if: ${{ always() }}
    # HOSTED, for the same reason the preflight above is hosted: a guard that
    # needs the fleet cannot act when the fleet is the problem.
    #
    # This job's whole purpose is to demote a release whose build just failed -
    # and a build fails most often when the fleet is congested or down, which
    # is exactly when a self-hosted job will not be scheduled. It is not
    # hypothetical: vaultspec-dashboard v0.1.7 failed every Compose leg, and
    # its guard then sat QUEUED for over an hour behind the one Linux/X64
    # runner it shares with the build, while the empty release went on serving
    # as `latest` and had to be demoted by hand.
    #
    # Nothing here needs a fleet capability. The job calls `gh release view`,
    # `gh release edit` and `gh workflow run`, and reads the workflow file with
    # awk - all of which a hosted runner does, without competing for the
    # machine that just failed.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Dispatching the acquisition check is a write to the Actions API.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      # The guard derives its expectation from the matrix in this file, so
      # it needs the file. Checked out explicitly rather than relying on
      # whatever tree a previous job happened to leave on this runner.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Require artifacts on the published release
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          assets=$(printf '%s' "${names}" | grep -c . || true)
          echo "release ${TAG} carries ${assets} asset(s); release job=${RELEASE_RESULT}"

          # EVERY DECLARED TARGET, not "any asset at all". v0.1.64 is why.
          #
          # Two of its build legs failed, so only part of the matrix reached the
          # release - yet the wheel, the sdist and SHA256SUMS were already
          # attached. The old check asked only whether the asset count was above
          # zero, saw five, and passed a release missing half its binaries. It
          # was caught by hand; the guard that exists for exactly this reported
          # success.
          #
          # Attaching the wheel and sdist also made the old threshold
          # unreachable: a release now carries three assets before a single
          # binary is built, so "greater than zero" can no longer be false. An
          # improvement elsewhere silently disarmed this check.
          #
          # The per-target assert in `Attach to release` cannot cover this - it
          # lives in the job that does not run when a build leg fails.
          #
          # Targets are DERIVED from the matrix rather than listed again: a
          # second list drifts, and a stranded expectation shipped v0.1.62 red.
          workflow=".github/workflows/binaries.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive targets"; exit 1; }
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          for triple in "${expected[@]}"; do
            printf '%s' "${names}" | grep -q -- "${triple}" || missing+=("${triple}")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "all ${#expected[@]} declared target(s) present on ${TAG}"
            # A COMPLETE ASSET SET IS NOT BY ITSELF A GOOD RELEASE, and until
            # now this guard behaved as though it were. The release job also
            # attests every artifact and verifies that attestation; when the
            # verification fails, the assets are ALREADY attached, so the
            # completeness test above passes and the promote step below then
            # clears the prerelease flag. The net effect was a release whose
            # provenance does not verify serving as `latest` - which is where
            # the README, the install prose and both channel manifests point.
            #
            # `needs.release.result` was already carried into this job's
            # environment and used only to decorate log lines. It is part of
            # the verdict now.
            if [ "${RELEASE_RESULT}" != "success" ]; then
              echo "::warning::${TAG} carries every declared target, but the release job ended '${RELEASE_RESULT}'"
              if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
                echo "::notice::demoted ${TAG} to a prerelease so latest skips it"
              fi
              echo "::error::${TAG} has every declared asset but its release job ended '${RELEASE_RESULT}' - provenance verification or the channel pointers did not complete. Demoted so it cannot serve as latest. Read the release job's log, fix, and re-dispatch."
              exit 1
            fi
            exit 0
          fi

          echo "::warning::${TAG} is missing: ${missing[*]}"
          # WHAT A RE-DISPATCH CAN AND CANNOT REPAIR, because the two
          # halves come from different places and only one of them moves.
          #
          # A dispatch resolves THIS FILE from the ref it is dispatched
          # against, but the build job checks out `inputs.tag` for the
          # SOURCE. So a fix to the matrix or to this guard can reach an
          # older tag; a fix to build scripts or packaging code cannot,
          # and that needs a NEW release.
          #
          # vaultspec-rag learned the second half on v0.4.15: the aarch64
          # floor fix sat on main and the repair dispatch kept compiling
          # the tag. This repository learned the first half on v0.1.66,
          # which shipped a binary a merged PR had already removed from
          # the matrix - because release-please dispatches with
          # `ref=${TAG}`, freezing the workflow too.
          echo "::error::Re-dispatch repairs a fix to THIS FILE (use --ref main), not a fix to tracked source. A source-level build fix needs a new release."

          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY"                   --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "::notice::demoted ${TAG} to a prerelease so latest skips it"
          fi

          echo "::error::${TAG} is INCOMPLETE - missing ${missing[*]} (release job=${RELEASE_RESULT}). It has been demoted to a prerelease so it cannot serve as latest. Fix the build and re-dispatch this workflow for this tag; the next step promotes it back once every declared target attaches."
          exit 1

      # Undo an earlier demotion once a re-dispatch actually attaches something.
      # Without this a repaired release stays invisible to `latest` forever.
      #
      # The tag decides whether promotion is wanted. release-please publishes
      # full releases here, so anything carrying a prerelease marker in its name
      # was meant to be one and must not be promoted into `latest` by a guard
      # that only knows about assets.
      # The acquisition check cannot see this release by itself. A release
      # published with the default token raises no workflow events, so its
      # `release: published` trigger never fires for anything this lane
      # produces - only its weekly schedule does, which is days of blindness
      # after every release. A dispatch is explicitly exempt from that rule,
      # which is why the binaries build is dispatched rather than waiting on a
      # tag push, and this is the same move for the same reason.
      #
      # A failure to dispatch does not fail the release: the artifacts are
      # already attached and verified by this point, and the weekly run still
      # covers the release eventually. It warns rather than passing silently.
      - name: Ask the acquisition check to try this release
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow run acquisition.yml --repo "$GITHUB_REPOSITORY"                --ref "${GITHUB_REF_NAME}" -f tag="$TAG"; then
            echo "dispatched the acquisition check for ${TAG}"
          else
            echo "::warning::could not dispatch the acquisition check for ${TAG}; its weekly run still covers this release"
          fi

      - name: Promote a repaired release back to latest
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-rc*|*-alpha*|*-beta*|*-dev*)
              echo "${TAG} names a prerelease; leaving its flag alone"
              exit 0
              ;;
          esac
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
            echo "::notice::promoted ${TAG} back to a full release"
          fi
