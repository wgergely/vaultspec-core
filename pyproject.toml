[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "Gergely Wootsch", email = "hello@gergely-wootsch.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0.3",
  "mcp>=2.0.0",
  "networkx>=3.6",
  "phart>=0.5.0",
  "pydantic>=2.12.5",
  "rich>=14.3.2",
  "ruamel.yaml>=0.18",
  "rustworkx>=0.18.0",
  "sse-starlette>=3.2.0",
  "starlette>=0.52.1",
  "typer>=0.12.0",
  "uvicorn>=0.41.0",
]
description = "Decision-driven harness for coding agents, and humans."
keywords = [
  "acp",
  "adr",
  "ai-assisted",
  "governance",
  "mcp",
  "decision-driven-development",
]
license = { file = "LICENSE" }
name = "vaultspec-core"
readme = "README.md"
requires-python = ">=3.13,<3.15"
version = "0.1.73"

  [project.urls]
  "Bug Tracker" = "https://github.com/nevenincs/vaultspec-core/issues"
  Documentation = "https://github.com/nevenincs/vaultspec-core/tree/main/docs/framework.md"
  Homepage = "https://github.com/nevenincs/vaultspec-core"
  Repository = "https://github.com/nevenincs/vaultspec-core"

  [project.scripts]
  "vaultspec-core" = "vaultspec_core.__main__:main"
  "vaultspec-mcp" = "vaultspec_core.mcp_server.app:run"

  [project.optional-dependencies]
  dev = [
    "identify>=2.0.0",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.0.10",
    "mdformat-gfm>=1.0.0",
    "mdformat-gfm-alerts>=1.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-durations>=1.0.0",
    "pytest-reportlog>=0.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.2",
    "ty>=0.0.15",
  ]

[dependency-groups]
# Local dev tooling only (PEP 735); NOT published in the wheel's Requires-Dist.
# vaultspec-rag (semantic search) and its torch backend live here so they never
# become runtime or published-extra dependencies of vaultspec-core. The cu130
# torch source pin in [tool.uv.sources] applies because torch is a direct dep here.
dev = [
  "bandit>=1.9.4",
  "basedpyright>=1.39",
  # Cognitive complexity - how much state a reader must hold to follow a
  # function, as distinct from the number of paths through it that xenon
  # measures. Configured from [tool.complexipy] below.
  "complexipy>=6.2",
  "deptry>=0.25.1",
  # Sole consumer is `dev/audit/dependency_audit.py`, which posts the locked
  # package set to the OSV querybatch API. Declared here rather than relied on
  # transitively: `mcp@2.0.0` moved to `httpx2`, so nothing in the runtime tree
  # pulls httpx any more.
  "httpx>=0.28.1",
  "identify>=2.0.0",
  "mdformat>=1.0.0",
  "mdformat-frontmatter>=2.0.10",
  "mdformat-gfm>=1.0.0",
  "mdformat-gfm-alerts>=1.0.0",
  # Module length and the class-shape design limits ruff has no rule for
  # (C0302, R0902, R0904, R0916). Everything else pylint would report is
  # already covered by ruff and stays disabled.
  "pylint>=4.0",
  "pymarkdownlnt>=0.9.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-durations>=1.0.0",
  "pytest-reportlog>=0.4.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "radon>=6.0.1",
  "ruff>=0.15.2",
  "torch>=2.4",
  "ty>=0.0.15",
  "vaultspec-rag[mcp]>=0.4.4",
  "vulture>=2.16",
  "xenon>=0.9.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Tests cohabit with the source they exercise, which puts them inside the
# distributed package tree. They are development artifacts and must never ship:
# a test that walks to a repository root, or writes scratch beside the source it
# imports, is meaningless once installed and hostile to the installing user's
# filesystem. The exclusion is what keeps the cohabitation convention honest -
# without it, co-locating a test silently publishes it.
exclude = ["**/tests", "**/tests/**"]
packages = ["src/vaultspec_core"]

[tool.pytest.ini_options]
# Every marker gating on something not installed/reachable by default is
# deselected here too, not just by the `just test` lanes' explicit `-m`: a
# bare `pytest` invocation (a contributor's shell, an editor's test runner)
# has no other gate, and without this a `@pytest.mark.gemini`/`claude` test
# shells out to a real external CLI, and a `@pytest.mark.network` test hits
# a live upstream, on every default run. Kept in sync by hand with
# `dev.toolchain.EXCLUDED_MARKERS`, which a repo guard cross-checks.
addopts = "-m 'not benchmark and not gemini and not claude and not network'"
asyncio_mode = "auto"
log_cli = true
log_cli_date_format = "%H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_level = "INFO"
# The debug trail a failing run leaves behind. It lives under `.pytest-tmp/`
# rather than the repository root so a test run cannot dirty the root: the
# `.pytest*/` line in .gitignore already covers the directory, and pytest
# creates missing parent directories for `log_file` itself (verified by
# deleting the directory and running the suite), so no bootstrap step is
# needed.
log_file = ".pytest-tmp/test-debug.log"
log_file_level = "DEBUG"
markers = [
  "api: API-level tests covering stable public analysis surfaces",
  "unit: fast tests with no external dependencies",
  # The counterpart population to every marker around it. Those select a slice
  # of the tests OF THE LIBRARY - by speed, by kind, by what they need
  # installed. This one names a different subject entirely: a test that asserts
  # something about the checkout it is running inside rather than about
  # `vaultspec_core`. Such a test legitimately needs a repository root, is
  # meaningless outside a source tree, and must never be swept into a library
  # lane. The marker is what makes that distinction selectable, rather than
  # leaving it implied by whichever directory a file happens to sit in - which
  # is how the two populations got confused in the first place.
  "repo: asserts a fact about this checkout, not about the shipped library",
  "integration: requires CLI tools and network",
  "network: requires live network access (upstream drift guards); excluded from gating suites",
  "gemini: requires Gemini CLI installed",
  "claude: requires Claude CLI installed",
  "timeout: timeout in seconds for individual tests",
  "e2e: end-to-end tests requiring real LLM API keys",
  "benchmark: slow scale benchmarks, deselected by default",
  # Selects the guards cheap enough to run on every commit, so the
  # pre-commit hook can name them without listing test names in a config
  # file - a list that goes quietly out of date the first time one is
  # renamed. The contract a test accepts by carrying this marker is only
  # that it is fast and reads the working tree; it is never the sole place
  # the test runs, because the CI `repo` lane runs the whole file whatever
  # this marker selects. The hook is an accelerator, not an enforcement
  # boundary.
  "precommit: cheap enough to gate every commit; also runs in the repo lane",
]
# Every tree that carries committed Python AND a cohabiting `tests/` package.
# `dev` is listed for the same reason `src` is: the harness backend has its own
# in-package test suite, and omitting the tree here meant a bare `pytest`
# collected none of it. The suite was still gated - `just test harness` and the
# CI step that runs it name the tree explicitly - but the default invocation
# and the gate disagreed about what the suite is, which is exactly how a lane
# goes unobserved.
#
# One `dev` entry now covers every instrument that lives there - the release
# binary build, the dependency-audit gate, the code-health report, the
# transcript analytics - each carrying a cohabiting `tests` package inside its
# own sub-package, so collection follows the tree rather than a list that has to
# be extended by hand whenever an instrument is added. `docs` is here for the
# one instrument that lives outside `dev`: the asset renderers in
# `docs/_render/`, which sit with the `docs/assets/` output they write.
#
# The same `dev` entry also collects `dev/guards`, the repository-wide contract
# guards. Those have no module to cohabit with - their subject is this
# checkout's own committed configuration - so they used to live in a
# repository-root `tests/` tree with its own collection root and its own test
# lane. The root is gone; the guards now ride the tree that already runs.
#
# These are the same two trees `INSTRUMENT_PATHS` in dev/toolchain.py names, so
# the default `pytest` invocation and the `test harness` gate cannot disagree
# about what the instrument suite is.
testpaths = ["dev", "docs", "src"]
timeout = 300
timeout_func_only = true

[tool.ruff]
line-length = 88
target-version = "py313"

  [tool.ruff.lint]
  # NOTE: preview is deliberately OFF here - enabling it globally changes the
  # behavior of stable rules and surfaces findings unrelated to the rule being
  # added. The preview-only nesting-depth rule (PLR1702) is gated separately by
  # `just lint nesting`, which runs a scoped `--select PLR1702 --preview`.
  #
  # TID252 (relative-imports) is off: this package is mixed - 1274 absolute and
  # 941 relative intra-package imports - and picking a side is an import-
  # convention decision that needs its own ADR and campaign, not a lint flag.
  # TID251 (banned-api) stays on.
  ignore = ["TID252"]
  select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "ARG",     # flake8-unused-arguments
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking
    "RUF",     # ruff-specific rules
    "N",       # pep8-naming
    "TID",     # flake8-tidy-imports
    "C90",     # mccabe complexity
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
  ]
  unfixable = ["B"]

    # BASELINE-CALIBRATED (census 2026-07-28, `just health --census`). Each
    # threshold sits at today's worst PRODUCTION offender, so the gate is green
    # on landing and can only ever be ratcheted DOWN. ruff's own defaults are
    # mccabe 10, returns 6, branches 12, args 5, statements 50 - the distance
    # between those and the numbers below is the burndown backlog.
    #
    # Cyclomatic census (production blocks):
    #     over 25:   9      over 15:  67      over 10: 176   <- the default
    [tool.ruff.lint.mccabe]
    max-complexity = 28 # RATCHETED 58 -> 57 -> 35 -> 28

    # Worst production value per rule at the census: returns 8, branches 28,
    # args 17, statements 93.
    #
    # `max-args` has a FLOOR that the other rules do not. A Typer command's
    # parameters are the CLI's flags, so its signature length is the published
    # interface, not debt: 35 of the 110 offenders are commands or callbacks,
    # and the current worst (17) is `vault add`. The remaining 75 are plain
    # helpers and are ordinary debt - keep ratcheting on those. Do not chase
    # ruff's default of 5 here by deleting user-facing flags, and do not add a
    # per-file-ignore for the command modules, which would also mask genuine
    # helper bloat living in those same files.
    #
    # PLR1702 (nesting depth) is NOT listed here: it reached ruff's own default
    # of 5 and is gated at that default by `just lint nesting`. It is the first
    # dimension to finish its burndown; the rest are still above default.
    [tool.ruff.lint.pylint]
    max-args = 17       # RATCHETED 20 -> 17 (floor is the worst Typer command)
    max-branches = 28   # RATCHETED 63 -> 62 -> 34 -> 28
    max-returns = 8     # RATCHETED 13 -> 10 -> 8
    max-statements = 93 # RATCHETED 214 -> 142 -> 93

    [tool.ruff.lint.per-file-ignores]
    "**/test_*.py" = ["ARG"]
    "**/tests/**/*.py" = ["ARG"]
    # Core CLI modules use argparse/Path as runtime parameter types - no need to move to TYPE_CHECKING
    "src/vaultspec_core/core/*.py" = ["TC003"]
    # The edit verbs declare Path-typed Typer options, which Typer introspects at
    # runtime; Path must stay a runtime import, not move to a TYPE_CHECKING block.
    "src/vaultspec_core/cli/edit_cmd.py" = ["TC003"]
    # Synthetic vault generator uses Path at runtime in dataclass fields and function args.
    "src/vaultspec_core/testing/synthetic.py" = ["TC003"]
    # Diagnosis dataclasses use Tool as runtime dict key and for JSON serialization.
    "src/vaultspec_core/core/diagnosis/diagnosis.py" = ["TC001"]
    # MCPServer inspects tool annotations at runtime, so Context must be importable.
    "src/vaultspec_core/mcp_server/tools/documents.py" = ["TC002"]
    "src/vaultspec_core/mcp_server/tools/gateway.py" = ["TC002"]
    "src/vaultspec_core/mcp_server/tools/orientation.py" = ["TC002"]
    "src/vaultspec_core/mcp_server/tools/plan.py" = ["TC002"]
    # Pydantic resolves field annotations from module globals at model-build time,
    # so the CallRecord field types must stay runtime imports, not TYPE_CHECKING.
    "dev/statistics/normalize/models.py" = ["TC001", "TC003"]

    [tool.ruff.lint.isort]
    known-first-party = ["vaultspec_core"]

    [tool.ruff.lint.flake8-type-checking]
    # Pydantic resolves a model's annotations when the class is created, so a
    # type used only in a field annotation is still needed at RUNTIME. Without
    # this, TC001 tells you to defer an import the model then cannot resolve.
    runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ty.environment]
python-version = "3.13"
root = [".", "src"]

# `typings/` holds hand-written stubs for untyped third-party packages, and it
# is basedpyright's `stubPath` - which is why basedpyright's own `include`
# below names only `src`, `dev`, `docs`. A stub there is not source: it exists
# to describe a dependency's surface TO a checker, and it is only meaningful
# through the resolution of the checker that consumes it.
#
# `ty` resolves those same dependencies from the installed packages instead,
# so walking `typings/` as if it were first-party source asks the wrong
# question and can only produce disagreements that say nothing about this
# codebase. `typings/phart/__init__.pyi` is the live example: `ty` calls
# `networkx.Graph[Any]` invalid because the installed `Graph` is not generic,
# while basedpyright reads its own bundled stub where it is generic over three
# parameters and requires the parameterisation. Neither verdict is about code
# anyone here wrote.
#
# Scoping `ty` to the same three trees basedpyright checks makes a bare `ty
# check` agree with the gate instead of failing on a directory the gate never
# claimed. It removes no coverage: every tree carrying tracked Python stays
# under BOTH checkers at full strictness, and `dev/guards/
# test_typings_fidelity.py` executes the stubbed surfaces for real, which is
# the check that actually proves a stub still matches its package.
[tool.ty.src]
include = ["src", "dev", "docs"]

# Strict-mode type checking, gating: `just lint type-strict` is in the `lint
# all` chain, and `ty` stays the fast pre-commit gate.
#
# `include` names every tree that carries tracked Python. It is deliberately
# NOT a claim that the burndown is finished - run the gate and read its own
# summary line for that. The list changed when the development tooling was
# consolidated: `statistic`, `scripts` and `tools` are gone as top-level trees,
# `dev` absorbed the instruments they held, and `docs` entered because the
# asset renderers in `docs/_render/` live with the output they write. `tests`
# left last, when the repository-wide contract guards it still held moved to
# `dev/guards` and the repository root was emptied of Python entirely.
[tool.basedpyright]
include = ["src", "dev", "docs"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

# Individual rules enabled beyond `strict`, curated rather than a blanket
# `typeCheckingMode = "all"` (4,625 findings on this tree, mostly noise).
# Every rule below was verified at zero findings before being turned on - a
# rule that starts red teaches people to ignore red.
reportEmptyAbstractUsage = "error"
reportIgnoreCommentWithoutRule = "error"
reportImplicitAbstractClass = "error"
reportImplicitRelativeImport = "error"
reportIncompatibleUnannotatedOverride = "error"
reportInvalidAbstractMethod = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportSelfClsDefault = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnsafeMultipleInheritance = "error"

# An override that drops `@override` loses its link to the base method
# silently: rename or remove the base method and the override becomes a dead
# sibling instead of a type error. This makes that relationship checked
# rather than a naming convention.
reportImplicitOverride = "error"

# A symbol imported into a module but not re-exported (no `__all__`, no
# `import X as X`) is that module's private implementation detail; a second
# module reaching past it is the same trust-boundary violation this repo
# already forbids for underscore-prefixed names - this is the
# non-underscore half of that same boundary.
reportPrivateLocalImportUsage = "error"

reportUnreachable = "error"

# basedpyright's own printed remedy for a validated site - routing through
# `cast("object", ...)` before the narrowing cast - clears both findings
# without a suppression, an idiom already precedented elsewhere in this
# repo, so both call sites were fixed rather than exempted.
reportInvalidCast = "error"

# Rejected on evidence, not merely unconsidered - do not re-enable without
# new data. reportUnusedCallResult (2,317 findings): dominated by discarded
# `write()` return counts and fluent/builder chains where the return value
# is conventionally ignored. reportImplicitStringConcatenation (375
# findings): fights this project's house style of splitting long messages
# across adjacent string literals rather than one wrapped line.
# reportCallInDefaultInitializer found one real bug (a Typer parameter still
# using a direct default instead of `Annotated[...]`, since fixed) but its
# remaining 2 findings are `frozenset[str] = frozenset()` defaults - a
# frozenset is immutable, so one def-time instance shared across every call
# is safe by construction, unlike the mutable-default bug this rule exists
# to catch. Hoisting both to a module-level constant purely to satisfy the
# rule would be contorting correct code to please a tool, which this
# campaign has refused throughout, so the rule stays off. Worth
# re-evaluating if basedpyright ever distinguishes immutable defaults from
# mutable ones - this is a judgement about today's tool behaviour, not a
# permanent verdict on the rule.

# In-package tests reach into the private internals of the modules they
# exercise, so reportPrivateUsage is a trust-boundary false positive here
# (fixing it by making internals public would damage the design). Every
# other strict rule stays ON for tests. See the second entry below for the
# repository-root test tree's different justification.

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/tests"

  # `src/vaultspec_core/vaultcore/tests` is a SEPARATE entry rather than a
  # widened `root` above, because `root` matches by literal directory prefix
  # only - no glob, no wildcard. `"src/vaultspec_core/**/tests"` was tested
  # directly against this tree: it matched nothing, and basedpyright raised
  # no complaint about the root being unmatched, so a glob "fix" here would
  # look correct while checking nothing. This directory reaches into its own
  # module's internals for the same reason the block above does.
  # `test_basedpyright_private_usage_exemption_covers_every_tests_directory`
  # in dev/guards/test_automation_contracts.py fails loudly if another
  # in-package `tests/` directory starts doing the same without a matching entry
  # here, rather than it silently losing the exemption it needs.
  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/vaultcore/tests"

  # There was a third entry here, rooted at the repository's own `tests/` tree,
  # exempted for a DIFFERENT reason than the two above: the in-package trees
  # reach into this project's internals, whereas that one reached into
  # THIRD-PARTY internals it had no authority over - `_windows_temp_compat.py`
  # mirrored pytest's private `TempPathFactory` attributes to work around a
  # Windows ACL bug, and there was no upstream symbol to promote. It carried an
  # `extraPaths = ["."]` of its own, because an executionEnvironment's `root` is
  # also its import-resolution base and the tree's `from tests.<module> import`
  # lines stopped resolving without the project root restored.
  #
  # Both the tree and the shim are gone. The repository-wide guards it held now
  # live in `dev/guards`, reach into nobody's internals, and resolve their
  # imports through the ordinary project root, so they need neither the
  # exemption nor the extra path. The classification order that produced the
  # original entry is still the one to follow if a tree ever needs an exemption
  # again: read every site, FIX what can be fixed, and exempt only the
  # remainder. An exemption extended by habit is how a gate stops meaning
  # anything.

  # Every remaining submodule that co-locates a `tests/` package beside the code
  # it exercises, one literal entry each for the prefix-matching reason given
  # above. These are mechanical: the guard named in that comment derives the
  # required set by walking every tree in `include` above for directories named
  # `tests`, so this list is exactly what it demands and adding a co-located
  # suite without its entry fails there rather than in the gate.
  #
  # `dev/guards` is the one `include`d directory holding tests that is NOT a
  # co-located suite and so never appears in that set: its subject is this
  # checkout's own committed configuration rather than a neighbouring module, so
  # it has no internals to reach into and needs no exemption. An exemption
  # granted before anything needs it is how a gate stops meaning anything; if
  # those guards ever do go whitebox, the gate will say so and an entry can be
  # added then, with the reason recorded.

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/config/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/core/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/graph/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/hooks/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/mcp_server/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/metrics/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/migrations/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/protocol/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/testing/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/vaultcore/checks/tests"

  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_core/verification/tests"

  # The instrument trees co-locate their tests under the same convention, so
  # they carry the same exemption. `dev/guards` is the exception that proves
  # the rule and needs no entry: its subject is this checkout's own committed
  # configuration rather than a neighbouring module, so it has no internals to
  # reach into.
  #
  # Each one needs `extraPaths` for the reason documented above: a `root` is
  # also the import-resolution base, and these suites import their subject by
  # its fully-qualified name (`dev.audit.dependency_audit`, `dev.health`, and
  # so on), which only resolves with the project root on the path. The
  # in-package entries above need no such line because `src` is already a
  # resolution root. Omitting it here does not fail loudly - it degrades every
  # import to Unknown and reports several hundred phantom errors that are
  # really one broken path.
  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/audit/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/binaries/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/ci_sentinel/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/packaging/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/health/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "dev/statistics/tests"

  [[tool.basedpyright.executionEnvironments]]
  extraPaths = ["."]
  reportPrivateUsage = false
  root = "docs/_render/tests"

# Cognitive complexity - how much state a reader must hold to follow a
# function, as distinct from the number of paths through it that `xenon`
# measures. Nesting compounds the score here, so a deeply-indented function
# ranks far worse than a flat one with the same branch count.
#
# BASELINE-CALIBRATED (census 2026-07-28): RATCHETED 253 -> 166 -> 154 -> 56 -> 51.
# Never raise. Long-term target: 15, the tool's own default.
#
# The 253 -> 166 step cost no work of its own: it fell out of the PLR1702
# nesting burndown. Cognitive complexity compounds with indentation depth, so
# flattening a deeply-nested function pays down this dimension far faster than
# its own branch count would suggest. Prefer nesting reduction over branch
# extraction when both are available on the same hotspot.
#
# The distance to the target, measured at the same time:
#
#     over  30:   39 functions
#     over  25:   55
#     over  20:   88
#     over  18:  115
#     over  16:  147
#     over  15:  160      <- the target
#
# Production only. Tests are measured by `just audit complexity`, which reports
# without failing: the worst scores belong to guard tests that walk the AST of
# every module, and that shape is what the guard IS, not debt to pay down.
[tool.complexipy]
exclude = ["**/tests/**"]
max-complexity-allowed = 51

# pylint runs with every check off except the four that ruff has no rule for.
# It is not a second general-purpose linter here - enabling more would produce
# findings ruff already reports, under a different code, with no new signal.
# The ignore pattern is a TOML LITERAL string on purpose. As a basic string,
# "[\\/]" decodes to the regex `[\/]`, whose character class is just a forward
# slash - so it never matched a Windows path and the test tree leaked into the
# gate. The literal form keeps both separators in the class.
[tool.pylint.main]
ignore-paths = ['.*[\\/]tests[\\/].*']
jobs = 0

[tool.pylint."messages control"]
disable = ["all"]
# C0302 too-many-lines               - module length; ruff has no rule for it
# R0902 too-many-instance-attributes - class state a reader must track
# R0904 too-many-public-methods      - class surface area
# R0916 too-many-boolean-expressions - condition legibility
enable = ["C0302", "R0902", "R0904", "R0916"]

# Module length. The ceiling is a ratchet, not a target - lower it whenever an
# extraction lands, and never raise it. The census counts PRODUCTION modules
# only, because `ignore-paths` above means those are the only ones this gate
# measures. Count what the gate counts.
#
# Census (2026-07-28, 241 production modules, RATCHETED 1668 -> 1312 after the
# `cli/spec_cmd.py` split cleared prior offenders and left `graph/api.py` the
# worst remaining module):
#
#     over 2000:   0
#     over 1500:   0
#     over 1200:   1      <- the enforced ceiling sits at the worst of these
#     over 1000:   1
#     over  500:  31      <- where modules should settle
#
# Longest production module: graph/api.py at 1312 lines.
#
# The `cli/spec_cmd.py` split (spec_cmd_agents.py, spec_cmd_app.py,
# spec_cmd_doctor.py, spec_cmd_hooks.py, spec_cmd_mcps.py,
# spec_cmd_reference.py, spec_cmd_rules.py, spec_cmd_shared.py,
# spec_cmd_skills.py, spec_cmd_system.py) is what finally moved this
# dimension: prior complexity waves only extracted helpers within these
# modules, which paid down per-function scores without touching physical
# length. Measure with `just health census`, which counts physical lines the
# way pylint's C0302 does - a count that skips blank lines reads ~375 lines
# short on the longest module here and will set a ceiling the tree cannot
# meet.
[tool.pylint.format]
max-module-lines = 1312

# BASELINE-CALIBRATED (census 2026-07-28): each sits at the current worst
# production offender, so the gate is green today and can only be ratcheted
# DOWN. pylint defaults: max-attributes=7, max-public-methods=20,
# max-bool-expr=5.
[tool.pylint.design]
max-attributes = 21 # baseline worst: 21 (core/diagnosis/diagnosis.py)
max-bool-expr = 5   # RATCHETED 6 -> 5, the pylint default: the three
# 6-expression conditions were extracted into named
# predicates, so this dimension is now fully paid off.
max-public-methods = 20 # already at the pylint default; no production class exceeds it

# Dead code. Advisory, not gating: vulture infers reachability and cannot see
# dynamic dispatch, so a finding is a lead to confirm rather than a verdict.
# Confidence 80 drops the guess-heavy tier that reports decorated and
# lazily-bound callables as unused.
[tool.vulture]
exclude = ["*/tests/*", "*test_*.py"]
ignore_decorators = [
  "@app.command",
  "@app.callback",
  "@click.command",
  "@click.group",
  "@pytest.fixture",
  "@field_validator",
  "@model_validator",
  "@property",
]
# Every name here is fixed by a protocol this code implements, or is reachable
# only through a string the scanner cannot follow. None is dead. Each was
# confirmed by reading the site before being listed - the list is not a way to
# quiet a finding that has not been read.
#
# - exc_val/exc_tb: `__exit__` fixes the names of its three trailing
#   parameters, so a context manager that inspects only `exc_type` - as
#   `vaultcore/rename_engine.py:188` does - reports the other two as unused.
ignore_names = ["exc_val", "exc_tb"]
min_confidence = 80
paths = ["src/vaultspec_core"]

# Security. Advisory: this project spawns subprocesses (the MCP gateway's
# `invoke` verb, the provider sync shells) and builds filesystem paths by
# construction, so the subprocess and path families report the design rather
# than a defect. They stay ENABLED and are read per finding - suppressing a
# family wholesale would also hide the first real one.
#
# The test tree is excluded by the `-x` flag in the `just audit security`
# recipe, NOT by an `exclude_dirs` key here: bandit reads `skips` from this
# table but silently ignores `exclude_dirs` from it. A suppression that does
# not suppress is worse than none, so the exclusion lives where it takes effect.
[tool.bandit]
# B101: `assert` is pytest's contract, and the excluded test tree is where it
# is load-bearing. Production invariants that must survive `-O` raise instead.
skips = ["B101"]

# Dependency drift. Reports imports that resolve only transitively - a
# transitive bump can withdraw one without any change here.
#
# The test tree is excluded because it ships INSIDE the package, at
# `src/vaultspec_core/tests/`. deptry classifies by path, not by marker, so it
# reads every `import pytest` there as production code reaching for a dev
# dependency and reports the whole tree under DEP004.
#
# `extend_exclude` is a TOML LITERAL string for the same reason as pylint's
# `ignore-paths` above: the basic-string form decodes to a character class of
# forward slash only and never matches a Windows path.
[tool.deptry]
extend_exclude = ['.*[\\/]tests[\\/].*']
known_first_party = ["vaultspec_core"]

  # Each entry is a deliberate declaration the scanner cannot infer, not a
  # finding waved through.
  [tool.deptry.per_rule_ignores]
  # DEP002 is "declared but never imported".
  #
  # sse-starlette / starlette / uvicorn are declared in [project.dependencies]
  # but serve no first-party import, and the evidence says they are redundant
  # rather than deliberate:
  #
  #   - The MCP server is STDIO-ONLY. `mcp_server/app.py` calls a bare
  #     `mcp.run()`, whose default transport is stdio, and the module's own
  #     comments name the stdio lifetime contract throughout. The HTTP and SSE
  #     transport stack is never constructed.
  #   - `mcp@2.0.0` already requires all three itself, so removing these
  #     declarations would not change a single resolved environment.
  #
  # They are NOT removed here only because a direct declaration of a transitive
  # package is also how one pins a security floor, and whether any of the three
  # was pinned for an advisory is an intent question the code cannot answer.
  # Resolve that, then delete them from [project.dependencies] and drop these
  # three names from the list below - do not leave the ignores standing as the
  # permanent answer.
  #
  # `httpx` WAS a fourth name here and is now resolved: the mcp 2.0 bump moved
  # the SDK to `httpx2`, so httpx stopped being a transitive of the runtime tree
  # entirely and the declaration was pinning a floor on a package nothing
  # installed or imported. Its only first-party import is the unshipped
  # `dev/audit/dependency_audit.py`, so it moved to the `dev` dependency group.
  #
  # The remaining names are the legacy `[project.optional-dependencies] dev`
  # extra, which duplicates the PEP 735 `dev` dependency group below it. They
  # are dev tools, so no production module imports them. Collapsing the two dev
  # surfaces onto the dependency group is tracked separately; until then the
  # scanner reports every one of them.
  DEP002 = [
    "sse-starlette",
    "starlette",
    "uvicorn",
    "identify",
    "mdformat",
    "mdformat-frontmatter",
    "mdformat-gfm",
    "mdformat-gfm-alerts",
    "pytest",
    "pytest-asyncio",
    "pytest-durations",
    "pytest-reportlog",
    "pytest-timeout",
    "ruff",
    "ty",
  ]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
